name: docker-image

# Builds and publishes the apps/console (Next.js) container image. Ticket #287 re-points this
# pipeline from `apps/self-service` (the Expo static export) to the console — the console needs a
# live Node server (server route handlers, a session-decrypting server component, a byte-forwarding
# RPC proxy), which the old nginx-static pipeline could never produce.
#
# Automatic builds were disabled 2026-08-26 specifically to stop publishing half-migrated *Expo*
# images while the console migration was mid-flight (see git history on this file). That concern
# doesn't apply to a distinctly-named console package, so the `push` triggers are restored here.
#
# IMPORTANT: apps/self-service keeps running in production (its own ArgoCD app, its own pinned
# image tag) until Epic 4 retires it — this workflow must never rebuild or republish that image.
# It doesn't: it only ever invokes `apps/console/Dockerfile` and only ever tags/pushes into the
# `console` GHCR package below, never into the existing `converse-frontends` package self-service's
# ArgoCD app / argocd-image-updater watch.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # A package DISTINCT from `ghcr.io/${{ github.repository }}` (the self-service/Expo image) —
  # deliberately so. argocd-image-updater watches that exact package name and commits the newest
  # signed `sha-<gitsha>` tag into environments/prod/values/converse-ui.yaml in the private
  # ai-helm-values repo; if the console pushed into the same package, image-updater would roll a
  # Node-server image onto self-service's still-live nginx-static Deployment; wrong port, wrong
  # probes, wrong config mechanism, no PR anywhere in the loop. The cluster's GHCR pull secret is
  # keyed on the `ghcr.io` host, not a package path, so a new package under the same
  # `adorsys-gis/converse-frontends` repo needs no separate credential.
  IMAGE_NAME: ${{ github.repository }}/console

jobs:
  build-and-push:
    # Rootless Buildah on the self-hosted runner (daemonless — no Docker/dind).
    # The standalone Next.js bundle is built here via Turbo (hitting the runner's Turbo cache),
    # then baked into a thin Node image. Single-arch: every cluster node is amd64.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      # Also regenerates the gitignored packages/authz-rpc/generated/ via the root
      # postinstall (`codegen:all`) — @cratestack/cli is a devDependency of that
      # package, so no separately installed tooling is needed. The CLI version is
      # an exact pin held in lockstep with the backend; see
      # packages/authz-rpc/README.md for why that matters.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `--filter=console` deliberately, not a bare `pnpm turbo run build:web`: `apps/self-service`
      # was removed (#368), so console is the only workspace with a `build:web` task today, but the
      # explicit filter is kept so this workflow keeps building exactly one package if the workspace
      # graph grows another `build:web` task later. apps/console/turbo.json already
      # overrides the root task's `dist/**` outputs with `.next/**` (excluding `.next/cache/**`)
      # for this package specifically, so Turbo caches and restores the standalone bundle
      # correctly; verified locally with two consecutive runs (second one reports `>>> FULL TURBO`).
      - name: Build console (Turbo)
        run: pnpm turbo run build:web --filter=console

      # `next.config.mjs` no longer has an `outputFileTracingIncludes` block for the CBOR codec
      # (Turbopack panics on it — see that file's own comment); the image ships those pnpm-store
      # dirs via an explicit `COPY` in apps/console/Dockerfile instead, sourced from
      # apps/console/.docker-stage/ (git-ignored, regenerated every run). This step is what
      # regenerates it — see scripts/stage-cratestack-cbor-for-docker.mjs's own header for why a
      # plain Dockerfile `COPY` can't do this glob-and-preserve-names copy itself.
      - name: Stage CBOR codec for the image (Turbopack CBOR-tracing workaround)
        run: node apps/console/scripts/stage-cratestack-cbor-for-docker.mjs

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GHCR (Buildah)
        # Direct `buildah login` writes the podman/buildah auth.json the build +
        # push steps read. (redhat-actions/podman-login mirrors creds to
        # ~/.docker/config.json, which ENOENTs on daemonless runners.)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | buildah login --username "${{ github.actor }}" --password-stdin "${{ env.REGISTRY }}"

      - name: Build image (Buildah, amd64, no layer cache)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          set -euo pipefail
          label_args=(); while IFS= read -r l; do [ -n "$l" ] && label_args+=(--label "$l"); done <<<"$LABELS"
          tag_args=();   while IFS= read -r t; do [ -n "$t" ] && tag_args+=(-t "$t");      done <<<"$TAGS"
          # No --layers / --cache-from / --cache-to: the Docker build is deliberately
          # uncached (caching lives in Turbo). Single amd64 platform. Build context is the
          # repo root (not apps/console/) — the standalone bundle's node_modules is hoisted to
          # the pnpm workspace root, so apps/console/Dockerfile needs the whole tree visible.
          buildah build --format docker --platform linux/amd64 \
            -f apps/console/Dockerfile "${label_args[@]}" "${tag_args[@]}" .
          # Export the first tag as a tarball so Trivy can scan it daemonless.
          primary="$(head -n1 <<<"$TAGS")"
          buildah push "$primary" docker-archive:/tmp/image.tar

      - name: Run Trivy vulnerability scanner on image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: /tmp/image.tar
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

      - name: Push image (all tags)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r t; do [ -n "$t" ] && buildah push "$t"; done <<<"$TAGS"
