name: docker-image

# Automatic image builds are DISABLED (owner directive, 2026-08-26).
#
# This pipeline images `apps/self-service` — the Expo web export — which ADR 0009 schedules for
# deletion once `apps/console` reaches feature parity. Publishing new images from it while the
# console migration is mid-flight would push half-migrated builds down the GitOps chain
# (GHCR → ai-helm `converse-ui` → cluster), so the `push` triggers are removed rather than left
# to fire on every merge to main.
#
# `workflow_dispatch` is kept so a release can still be cut deliberately.
#
# Re-enable by restoring the `push:` block below — and re-point it at `apps/console` rather than
# the Expo app, which is the cutover PR's job:
#
#   push:
#     branches: [main]
#     tags: ['v*']
on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    # Rootless Buildah on the self-hosted runner (daemonless — no Docker/dind).
    # The web bundle is built here via Turbo (hitting the runner's Turbo cache),
    # then baked into a thin nginx image. Single-arch: every cluster node is amd64.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      # Also regenerates the gitignored packages/authz-rpc/generated/ via the root
      # postinstall (`codegen:all`) — @cratestack/cli is a devDependency of that
      # package, so no separately installed tooling is needed. The CLI version is
      # an exact pin held in lockstep with the backend; see
      # packages/authz-rpc/README.md for why that matters.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the static web export on the runner. Turbo pulls from / writes to
      # the runner's integrated Turbo cache — no Docker/BuildKit layer cache.
      - name: Build web export (Turbo)
        run: pnpm turbo run build:web

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GHCR (Buildah)
        # Direct `buildah login` writes the podman/buildah auth.json the build +
        # push steps read. (redhat-actions/podman-login mirrors creds to
        # ~/.docker/config.json, which ENOENTs on daemonless runners.)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | buildah login --username "${{ github.actor }}" --password-stdin "${{ env.REGISTRY }}"

      - name: Build image (Buildah, amd64, no layer cache)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          set -euo pipefail
          label_args=(); while IFS= read -r l; do [ -n "$l" ] && label_args+=(--label "$l"); done <<<"$LABELS"
          tag_args=();   while IFS= read -r t; do [ -n "$t" ] && tag_args+=(-t "$t");      done <<<"$TAGS"
          # No --layers / --cache-from / --cache-to: the Docker build is deliberately
          # uncached (caching lives in Turbo). Single amd64 platform.
          buildah build --format docker --platform linux/amd64 \
            -f Dockerfile "${label_args[@]}" "${tag_args[@]}" .
          # Export the first tag as a tarball so Trivy can scan it daemonless.
          primary="$(head -n1 <<<"$TAGS")"
          buildah push "$primary" docker-archive:/tmp/image.tar

      - name: Run Trivy vulnerability scanner on image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: /tmp/image.tar
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

      - name: Push image (all tags)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r t; do [ -n "$t" ] && buildah push "$t"; done <<<"$TAGS"
