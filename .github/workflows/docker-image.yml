name: docker-image

on:
  push:
    branches:
      - main
      - 8-align-lightbridge-ui-with-authz-usage-apis-before-deployment
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    # Rootless Buildah on the self-hosted runner (daemonless — no Docker/dind).
    # The web bundle is built here via Turbo (hitting the runner's Turbo cache),
    # then baked into a thin nginx image. Single-arch: every cluster node is amd64.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache cratestack-cli
        id: cratestack-cache
        uses: actions/cache@v6
        with:
          path: ~/.local/bin/cratestack
          key: cratestack-cli-0.7.16-${{ runner.os }}-${{ runner.arch }}

      # 0.4.16+ ships prebuilt binaries on GH Releases — no Rust toolchain needed.
      # This MUST match lightbridge-authz's `cratestack`/`cratestack-pg` pin
      # (root Cargo.toml [workspace.dependencies]) exactly — nothing here enforces that
      # automatically, it is a manual convention. A drift between this pin and the deployed
      # backend's is exactly how lightbridge-authz#282 happened: cratestack 0.7.11 changed
      # `Value`'s wire format from externally-tagged to untagged, this generator stayed on 0.4.16
      # and kept hand-tagging `Json` fields to match the old shape, and the untagged-`Value`
      # backend decoded the stale tagged payload without error (`deserialize_any` treats any JSON
      # object as `Value::Map`), storing `{"List": [...]}` literally and silently defeating the
      # `allowedModels` governance allowlist. See lightbridge-authz#282 / converse-frontends#149.
      - name: Install cratestack-cli
        if: steps.cratestack-cache.outputs.cache-hit != 'true'
        env:
          CRATESTACK_VERSION: '0.7.16'
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) target="x86_64-unknown-linux-gnu" ;;
            aarch64|arm64) target="aarch64-unknown-linux-gnu" ;;
            *) echo "Unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          asset="cratestack-cli-${target}-v${CRATESTACK_VERSION}.tar.gz"
          base_url="https://github.com/cratestack/cratestack/releases/download/v${CRATESTACK_VERSION}"
          curl -fsSL -o "$asset" "${base_url}/${asset}"
          curl -fsSL -o "${asset}.sha256" "${base_url}/${asset}.sha256"
          sha256sum -c "${asset}.sha256"
          tar xzf "$asset"
          mkdir -p ~/.local/bin
          install -m 755 cratestack ~/.local/bin/cratestack

      - name: Add ~/.local/bin to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # generated/ is gitignored (codegen output, not something CI's Node/pnpm
      # install can produce) — regenerate it before the bundle needs it.
      - name: Generate authz-rpc bindings
        run: pnpm --filter @lightbridge/authz-rpc run codegen:cratestack

      # Build the static web export on the runner. Turbo pulls from / writes to
      # the runner's integrated Turbo cache — no Docker/BuildKit layer cache.
      - name: Build web export (Turbo)
        run: pnpm turbo run build:web

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GHCR (Buildah)
        # Direct `buildah login` writes the podman/buildah auth.json the build +
        # push steps read. (redhat-actions/podman-login mirrors creds to
        # ~/.docker/config.json, which ENOENTs on daemonless runners.)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | buildah login --username "${{ github.actor }}" --password-stdin "${{ env.REGISTRY }}"

      - name: Build image (Buildah, amd64, no layer cache)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          set -euo pipefail
          label_args=(); while IFS= read -r l; do [ -n "$l" ] && label_args+=(--label "$l"); done <<<"$LABELS"
          tag_args=();   while IFS= read -r t; do [ -n "$t" ] && tag_args+=(-t "$t");      done <<<"$TAGS"
          # No --layers / --cache-from / --cache-to: the Docker build is deliberately
          # uncached (caching lives in Turbo). Single amd64 platform.
          buildah build --format docker --platform linux/amd64 \
            -f Dockerfile "${label_args[@]}" "${tag_args[@]}" .
          # Export the first tag as a tarball so Trivy can scan it daemonless.
          primary="$(head -n1 <<<"$TAGS")"
          buildah push "$primary" docker-archive:/tmp/image.tar

      - name: Run Trivy vulnerability scanner on image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: /tmp/image.tar
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

      - name: Push image (all tags)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r t; do [ -n "$t" ] && buildah push "$t"; done <<<"$TAGS"
