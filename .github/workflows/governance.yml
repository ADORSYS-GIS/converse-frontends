# Per-repo caller workflow for AI Governance PR enforcement.
#
# Drop this file at .github/workflows/governance.yml in a consuming repo to opt in.
# It delegates to the reusable workflow hosted in ADORSYS-GIS/ai-governance, which
# fails the PR if its body is missing an AI Usage Declaration, a source-of-truth
# reference, or verification evidence — and posts a sticky comment listing what's missing.
#
# Source of truth: https://adorsys-gis.github.io/ai-governance/
#
# The reusable workflow is pinned to an immutable commit SHA, not @main or a movable
# tag, so a future push — or a moved tag — to ai-governance cannot change what runs
# here with write access. Bump the SHA deliberately when adopting a new governance
# release. (Pinned past v1.0.0 to a commit that supports the `runs-on` input, so this
# check runs on the self-hosted adorsys-gis-runner like every other job in this repo.)
name: AI Governance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  governance:
    # ADORSYS-GIS/ai-governance governance-check.yml — pinned past v1.0.0 to the
    # commit that added the `runs-on` input (PR #17, 2026-07-06).
    uses: ADORSYS-GIS/ai-governance/.github/workflows/governance-check.yml@f1735f92f24dd86c7707ed990a3f3ecb51e2ea9b
    with:
      runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
