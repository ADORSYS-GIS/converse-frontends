# Storybook -> GitHub Pages.
#
# GitHub Pages is a REPO SETTING, not something a workflow can turn on, and it is currently OFF
# for this repository. `actions/configure-pages` hard-fails on that ("Get Pages site failed. Please
# verify that the repository has Pages enabled"), which was painting every `main` run of this
# workflow red and drowning out real failures (converse-frontends#443).
#
# So the deploy half is GATED on a live probe of the Pages API instead: `preflight` asks
# `GET /repos/{owner}/{repo}/pages` and reports whether a Pages site exists. Pages off -> the two
# Pages steps and the whole `deploy` job report as SKIPPED (not failed, and not
# `continue-on-error`, which would hide a genuine deploy failure just as effectively). Pages on ->
# they run, with no further edit here: the moment someone enables Pages in repo settings the next
# push deploys. The Storybook BUILD always runs either way, so a broken story still fails `main`.
name: storybook-pages

on:
  push:
    branches: ['main']
    paths:
      - 'packages/ui-web/**'
      # `apps/lci` is a second story root (`packages/ui-web/.storybook/main.ts` globs both trees --
      # LCI's screens are app-local by ADR 0014 and do not move into `ui-web`). Without this line a
      # broken LCI story would land on `main` with this workflow never running.
      - 'apps/lci/**'
      - 'scripts/storybook-taxonomy.mjs'
      - '.github/workflows/storybook-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  preflight:
    name: Check GitHub Pages is enabled
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages-enabled: ${{ steps.probe.outputs.pages-enabled }}
    steps:
      - name: Probe the Pages API
        id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 200 = a Pages site exists. 404 = Pages is disabled for this repo (the documented
          # response; the API does not distinguish "never enabled" from "turned off"). Anything
          # else is treated as "not enabled" as well -- this is a deploy convenience, and no
          # transient API hiccup should be able to fail `main`.
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages")"
          if [ "${code}" = "200" ]; then
            echo 'pages-enabled=true' >> "${GITHUB_OUTPUT}"
            echo "GitHub Pages is enabled -- Storybook will be deployed."
          else
            echo 'pages-enabled=false' >> "${GITHUB_OUTPUT}"
            echo "::notice title=Storybook deploy skipped::GitHub Pages is not enabled for ${GITHUB_REPOSITORY} (GET /pages returned HTTP ${code}). Storybook was still built; enable Pages in Settings > Pages (source: GitHub Actions) and the next push to main will publish it. Nothing to fix in this workflow."
          fi

  build:
    name: Build Storybook
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Always runs: this is the only place `main` builds Storybook, so a broken story must still
      # fail here whether or not Pages is on.
      - name: Build Storybook (turbo)
        run: pnpm turbo run build-storybook

      - name: Set up GitHub Pages
        if: needs.preflight.outputs.pages-enabled == 'true'
        uses: actions/configure-pages@v6

      - name: Upload Storybook artifact
        if: needs.preflight.outputs.pages-enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: packages/ui-web/storybook-static

  deploy:
    name: Deploy to GitHub Pages
    needs: [preflight, build]
    if: needs.preflight.outputs.pages-enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
