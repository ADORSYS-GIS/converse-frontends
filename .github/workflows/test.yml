name: test

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: adorsys-gis-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache cratestack-cli
        id: cratestack-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cratestack
          key: cratestack-cli-0.4.11-${{ runner.os }}

      - name: Install Rust toolchain
        if: steps.cratestack-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install cratestack-cli
        if: steps.cratestack-cache.outputs.cache-hit != 'true'
        run: cargo install cratestack-cli --version 0.4.11 --locked

      # generated/ is gitignored (Rust-toolchain codegen, not something CI's
      # Node/pnpm install can produce) — regenerate it before tests import it.
      - name: Generate authz-rpc bindings
        run: pnpm --filter @lightbridge/authz-rpc run codegen:cratestack

      - name: Run tests
        run: pnpm test
