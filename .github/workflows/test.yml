name: test

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  # The BROWSER half of the accessibility gate (#443). Its own job, not a step on `test`, for one
  # reason: it needs a real Chromium. Folding it into `Unit tests` would put a ~150 MB Playwright
  # download on the critical path of a job that runs in seconds, and would merge two distinctly
  # attributable failures into one red X — the same argument `typecheck` makes below.
  #
  # The jsdom half needs nothing extra: it is an `afterEach` inside the ordinary suites and already
  # runs in `test`. Both halves, plus the eslint-plugin-jsx-a11y half, are mapped in
  # docs/knowledge/accessibility.md.
  a11y:
    name: Accessibility (Storybook, both themes)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `--with-deps` installs the shared libraries headless Chromium needs on a bare
      # `ubuntu-latest` image; `chromium` alone, because `vitest.storybook.config.mts` asks for
      # exactly one browser and pulling Firefox and WebKit as well would triple the download for
      # nothing. The version comes from the lockfile's `playwright`, so the browser and the driver
      # can never drift apart.
      - name: Install the Playwright browser
        run: pnpm --filter @lightbridge/ui-web exec playwright install --with-deps chromium

      # Every story, both themes, `parameters.a11y.test = 'error'`, `color-contrast` ON. The script
      # compares the result against packages/ui-web/a11y-storybook-baseline.json and fails on any
      # finding that is not already recorded there — and equally on a recorded finding that has
      # stopped firing, which is what makes the list a ratchet rather than a graveyard.
      - name: Storybook accessibility gate
        run: pnpm --filter @lightbridge/ui-web run test:a11y

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      # Also regenerates the gitignored packages/authz-rpc/generated/ via the root
      # postinstall (`codegen:all`) — @cratestack/cli is a devDependency of that
      # package, so no separately installed tooling is needed. The CLI version is
      # an exact pin held in lockstep with the backend; see
      # packages/authz-rpc/README.md for why that matters.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # apps/typst-render's golden test shells out to the real compiler — a mocked one would
      # prove nothing about the only thing that service does. Without the binary the suite skips
      # (loudly), so this step is what stops a PR from regressing the render path unnoticed
      # between merges to main. The binary is taken from the exact image
      # apps/typst-render/Dockerfile pins, so CI tests the Typst that actually ships; $HOME/.local
      # /bin rather than /usr/local/bin because the latter is root-owned on the hosted runner.
      - name: Install the pinned Typst binary (apps/typst-render)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          container="$(podman create ghcr.io/typst/typst:0.15.1)"
          podman cp "$container:/bin/typst" "$HOME/.local/bin/typst"
          podman rm "$container"
          chmod +x "$HOME/.local/bin/typst"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/typst" --version

      - name: Run tests
        run: pnpm test

  # tsc is not run by Metro/Expo's bundler (see the `build-web` job below) and
  # nothing else on the pull_request path turns a type error into a failed
  # check — quality.yml's tsc step never fails the PR (see docs/knowledge/ci-cd.md,
  # "Known Gaps" #2). This job is the actual enforcement point. A separate job
  # (rather than an extra step on `test`) costs one more `pnpm install`, but buys
  # a distinctly-named, independently-attributable check in the PR list — a type
  # error and a failing Jest test must not look like the same red X.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Discover every workspace's tsconfig.json rather than hardcoding a fixed
      # list of workspace names — this
      # mirrors the discovery already used by .ci/quality/run.sh, so a workspace
      # that gains a tsconfig.json later is picked up automatically instead of
      # becoming a second stale hardcoded list.
      #
      # `-maxdepth 2` is deliberate, not arbitrary: pnpm-workspace.yaml declares
      # the workspaces as `apps/*` and `packages/*`, so a workspace root is
      # always exactly one level down and its tsconfig.json exactly two. A
      # tsconfig nested deeper than that belongs to something that is not a
      # workspace root, and `tsc -p` on it would not be this gate's job. If the
      # workspace globs in pnpm-workspace.yaml ever gain a level, this depth
      # must change with them.
      #
      # Exit codes are captured directly (never through a pipe into another
      # command) so a `tsc` failure can't be swallowed.
      #
      # `shell: bash` is explicit, not incidental: GitHub Actions' implicit
      # default for a `run:` step with no `shell:` is `bash -e {0}`, and `-e`
      # is NOT cleared by this script's own `set -uo pipefail`. Under `-e`,
      # `pnpm exec tsc ...; cfg_exit=$?; [ "$cfg_exit" -ne 0 ] && ...` would
      # abort the step at the first failing workspace instead of checking the
      # rest — the accumulation loop would silently never run past the first
      # failure. `cmd || tsc_status=1` sidesteps this because a command on the
      # left of `||` is exempt from `-e` by POSIX shell semantics, regardless
      # of which shell (implicit or pinned) is running it.
      - name: Typecheck all workspaces
        shell: bash
        run: |
          set -uo pipefail
          mapfile -t tsconfigs < <(find apps packages -maxdepth 2 -name tsconfig.json \
            -not -path '*/node_modules/*' -not -path '*/generated/*' | sort)
          if [ "${#tsconfigs[@]}" -eq 0 ]; then
            echo "::error::No tsconfig.json found under apps/ or packages/ — the typecheck gate would be a no-op"
            exit 1
          fi
          tsc_status=0
          for cfg in "${tsconfigs[@]}"; do
            echo "::group::tsc --noEmit -p $cfg"
            pnpm exec tsc --noEmit -p "$cfg" || tsc_status=1
            echo "::endgroup::"
          done
          exit "$tsc_status"

  # Metro/Expo's bundler does not typecheck, so `pnpm build` can succeed on code
  # `tsc` rejects — that's the `typecheck` job's job, not this one's. This job
  # exists because, before it, `docker-image.yml` (push-to-main/tag only) was
  # the *only* place `turbo run build:web` ran in CI: a broken Expo web export
  # could merge and sit on main across any number of unrelated PRs until the
  # next push to main caught it post-merge (see docs/knowledge/ci-cd.md, Known
  # Gap #1 — this happened for two weeks before it was caught). `pnpm build` is
  # the root task name (`turbo run build:web`); `pnpm build:web` doesn't exist
  # at the root. Turbo's `build:web` task already declares `codegen` as a
  # `dependsOn` (turbo.json), so no separate codegen step is added here.
  build-web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web export (Turbo)
        run: pnpm build
