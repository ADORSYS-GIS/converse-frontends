# apps/console — server-side runtime configuration.
#
# YAML-first, matching lightbridge-authz's config/default.yaml shape: this file is the primary
# config document, not `.env`. `{env:SOME_ENV}` placeholders resolve to the corresponding
# environment variable at load time (see src/server/config-loader.ts for the exact resolution
# rules and its documented divergences from authz's `${VAR:-default}` syntax). Everything that is
# NOT a secret and has a safe local-dev value is written here as a plain literal instead — a real
# deployment ships its own config.yaml (point CONSOLE_CONFIG at it) rather than overriding
# individual non-secret fields through the environment.
#
# None of this reaches the browser (ADR 0009 Decision 3: the console is the only exposed origin;
# the browser talks to same-origin /api/* and nothing else). The nginx/envsubst
# `EXPO_PUBLIC_*`/config.json machinery the Expo app needs has no equivalent here.

# ── Session encryption ────────────────────────────────────────────────────────────────────────
session:
  # Cookie-session JWE key material (A256GCM via an HKDF of this value). At least 32 characters.
  # ALWAYS a placeholder, never a literal, even in dev — it's a secret regardless of how low-stakes
  # the local value is. Deploy-time secret: rotating it invalidates every live session. Generate
  # with: openssl rand -base64 48
  secret: '{env:SESSION_SECRET}'

# ── IdP (OIDC) ────────────────────────────────────────────────────────────────────────────────
# The OIDC provider this console authenticates against. Deliberately NOT named `keycloak`: in a
# real deployment this is `authz-idp`, lightbridge's own IdP, which brokers the actual login to
# Keycloak behind the scenes (ADR-0025). The console is a plain OIDC client and does not care which
# provider answers -- naming the block after one particular product made a deployment detail look
# like a hard dependency. Sits alongside `backendUrl` / `budgetUrl` / `usageUrl`: one key per
# lightbridge component this app talks to.
idp:
  # Issuer URL — discovery resolves every endpoint from it, nothing is hardcoded. Not a secret, so
  # it's a literal dev default here (local compose `keycloak-26` + .docker/keycloak-config/); a
  # real deployment ships its own config.yaml with its own issuer rather than overriding this one
  # field through the environment.
  issuer: 'http://localhost:13444/realms/lightbridge-dev'
  clientId: 'self-service'

  # Only for a confidential client. The dev realm's `self-service` client is public + PKCE, so this
  # resolves to undefined there; setting IDP_CLIENT_SECRET switches the client to
  # `client_secret_post` authentication. Always a placeholder (secret when present).
  clientSecret: '{env:IDP_CLIENT_SECRET}'

  # `offline_access` is what makes the long-lived silent refresh possible.
  scopes: 'openid profile email offline_access'

  # The access token's `aud` must contain at least one of these, checked on login AND on every
  # refresh; a mismatch blocks the session. Mirrors EXPO_PUBLIC_KEYCLOAK_EXPECTED_AUDIENCE. Empty
  # list = skip the check entirely (not recommended). A real YAML array, not authz's comma-joined
  # string — though a single `{env:VAR}` placeholder resolving to a comma-separated string also
  # works (src/server/env.ts's parseAudienceList accepts both).
  #
  # The imported dev realm's `self-service` client carries an `oidc-audience-mapper`
  # (`converse-frontend-audience` in .docker/keycloak-config/realm.theme.vymalo-wh-01.json) that
  # mints `aud: converse-frontend` on every access token, so this is enough to exercise the check
  # locally — the same audience check a real deployment exercises, not a skipped one.
  expectedAudiences:
    - 'converse-frontend'

  # `false` allows a token with no `aud` claim at all. A WRONG audience is always rejected
  # regardless.
  audienceRequired: true

  # Claim carrying the caller's RBAC roles. Matches `getJwtRoles`'s default in
  # packages/hooks/src/auth/jwt-utils.ts. Keycloak's realm_access/resource_access roles are merged
  # in as well, so a realm granting `lightbridge-admin` natively also works.
  rolesClaim: 'lightbridge_api_roles'

# ── Backends (never exposed to the browser) ───────────────────────────────────────────────────
# authz-api. Local lightbridge-authz compose stack, plaintext HTTP dev mode. Not a secret.
backendUrl: 'http://localhost:13000'

# RPC base path on authz-api — `/api/rpc/{op_id}` is served under this prefix.
# '/' normalizes to '' (see normalizeBasePath in src/server/env.ts), targeting
# {backendUrl}/rpc/{op_id} -- which is where authz-api actually serves the generated RPC
# surface: its `server.api.rpc_base_path` is unset in .docker/authz/container.yaml and is
# not set by ai-helm-values either, so no deployment mounts it under /api. The previous
# '/api' produced a 404 on every call against a real backend. Unrelated to the browser-facing
# /api/rpc/{op} route this app serves itself -- that stays /api.
apiBasePath: '/'

# authz-budget: the microservice the 14 budget:*-gated procedures moved onto (hard cutover,
# lightbridge-authz PR #351). Falls back to backendUrl when unset; budget calls 404 until this
# points at a real authz-budget instance.
budgetUrl: 'http://localhost:13005'

# The usage backend (POST /usage/v1/usage/query). Left unset (no local usage backend) — /api/usage/*
# then answers 503 and the Overview renders its honest "unwired" status line rather than an empty
# chart that reads as zero usage. Uncomment and point at a real instance to wire it up.
# usageUrl: "http://localhost:13006"

# Client certificate for the usage backend's QUERY listener, which requires mTLS
# (lightbridge-authz#347/#361) and has no bearer-token auth of its own -- the certificate IS the
# authentication, so there is no "just send the access token" path: without it the connection is
# refused at the TLS handshake, before any HTTP exists to carry a token.
#
# Both keys or neither. A cert without a key cannot produce a working identity, so a
# half-configured block is treated as unconfigured rather than failing per-request.
#
# Unset here (local dev has no usage backend). When unset, `usageDispatcher()` yields nothing and
# /api/usage/* answers its honest 503 -- the same state a deployment without `usageUrl` gets.
#
# What this configures is what the console PRESENTS. What it TRUSTS comes from
# NODE_EXTRA_CA_CERTS. Both directions stay verified; neither is a way to turn verification off.
# usageClientCert:
#   certPath: /etc/lightbridge/tls/tls.crt
#   keyPath: /etc/lightbridge/tls/tls.key

# ── Public origin ─────────────────────────────────────────────────────────────────────────────
# The absolute origin browsers reach this app on. Used to build the OIDC redirect URI, the RP-
# initiated logout redirect and the /.well-known/oauth-protected-resource `resource` identifier.
# Falls back to the incoming request's own origin, which is correct for local development but NOT
# behind a proxy that rewrites Host — a real deployment's own config.yaml sets this explicitly.
publicBaseUrl: 'http://localhost:3000'

# ── Report export (converse-frontends#453) ────────────────────────────────────────────────────
# `GET /api/reports/page` builds a JSON data file plus one SVG per chart panel and POSTs them,
# with the route's own `.typ` template, to the `typst-render` sidecar (apps/typst-render). The
# console image carries NO PDF toolchain — no Typst binary, no browser engine — which is an
# explicit acceptance criterion of that story.
#
# THE ENVIRONMENT VARIABLE IS ALSO READ DIRECTLY, not only through the placeholder below (owner
# feedback 2026-09-03; env.ts `resolveTypstRenderUrl`). This document is the console's own; a real
# deployment ships ITS OWN config.yaml, and prod's predates this story and carries no `reports:`
# block — so the placeholder that would have read the variable was never in the parsed document,
# and a correctly-deployed sidecar was still refused with "PDF export needs the typst-render
# service". The placeholder lives in a file the deployment owns; the variable lives on a container
# the chart owns, which is why the fallback is a direct read and not another placeholder.
#
# YAML still wins when this key is set, so a document naming a different renderer is never
# overridden by a stale variable. A deployment values file needs no `reports:` block at all.
#
# `{env:TYPST_RENDER_URL}` because the URL is the DEPLOYMENT's to know, not this document's: the
# Helm chart runs the renderer as a loopback-only sidecar and sets `TYPST_RENDER_URL:
# http://127.0.0.1:8080` on the console container (charts/converse-console/values.yaml). Locally,
# `compose.yml`'s `typst-render` service publishes the same port, so the default below is the
# right one for a dev checkout.
#
# UNSET is a real, supported deployment state, not a misconfiguration: `format=csv` and
# `format=html` keep working and `format=pdf` answers a 502 that SAYS the renderer is not
# configured. It never falls back to a chartless PDF — the story calls that failure mode out by
# name.
#
# Report BRANDING is not configured here either — the `branding:` block below is the single source
# for both the console header and the report letterhead. `_lib/report.typ` draws the configured
# mark left of the title on every report; the LIGHT-background variant prints (`branding.logoLight`
# when set, else `branding.logo`), because paper is white and `branding.logo` is the dark-theme
# mark. See docs/knowledge/console-configuration.md, "Report export".
#
# Template overrides are NOT configured here. They are read from the `CONSOLE_TEMPLATES_DIR`
# environment variable (default `/config/console/templates`), which the chart always sets, because
# it is a mount path the chart alone owns — same reasoning as `CONSOLE_CONFIG` itself. Lookup is
# per FILE: `${CONSOLE_TEMPLATES_DIR}/<route>/report.typ` wins for that one report, and a route
# with no override file falls back to the template baked into the image.
reports:
  typstRenderUrl: '{env:TYPST_RENDER_URL}'

# ── Branding (runtime white-label, optional) ──────────────────────────────────────────────────
# Owner design (issue #368, Phase H): "a .branding key inside the config, that will hold .logo: a
# host absolute path to the logo file... .style: a host absolute path to the css file. This should
# be only for daisyui css variables, like --color-primary, ... But the theme names would be
# preserved. This way, we could mount a configmap containing the key logo.png and the other key
# override.style into /tmp/branding as a volume."
#
# `logo`/`style` are independently optional -- unlike `usageClientCert` above, they serve two
# unrelated routes (`GET /branding/logo`, `GET /branding/override.css`) that each 404 honestly when
# their own field is unset, so there is no "half-configured" failure mode pairing them the way a
# TLS cert+key pair. Absent block (the default here) means today's behaviour exactly: no
# `<link>`/`<img>` override anywhere, every branding route 404s.
#
# `logoLight` (per-theme logos addendum, owner directive 2026-08-31: "White is for dark themes")
# is the ONE exception to "independently optional": it is a light-theme COUNTERPART to `logo`, not
# a standalone field. `logo` alone is both the default mark and the dark-theme (`black`) mark;
# `logoLight`, when also present, is what renders instead under the light theme (`wireframe`) --
# see `client/console-chrome.tsx`'s `BrandMark` for the pure-CSS `[data-theme]` swap (zero flash,
# zero JS, same mechanism the pre-hydration script/ADR 0010 already give every other themed value).
# `logoLight` with no `logo` is a config error, not a silently-accepted "light-only brand": dark is
# this console's default theme, so a deployment with only a light-theme mark would render NO logo
# at all on first paint for most visitors -- `env.ts` fails fast at boot instead.
#
# Every path must be host-absolute (`env.ts` fails fast at config-parse time otherwise) since they
# are read straight off disk with `node:fs`, not resolved against the app's own working directory
# -- a real deployment mounts the ConfigMap described above at exactly these paths (see
# charts/converse-console's own `branding` values block).
#
# `logo`/`logoLight`'s extension decides their response `Content-Type` (`env.ts` fails fast on
# anything other than `.png`/`.svg`/`.jpg`/`.jpeg`/`.webp` -- an operator typo here is a deploy-time
# config error, not a request-time 500).
#
# THIS BLOCK IS ALSO THE REPORT LETTERHEAD (owner feedback 2026-09-03, "the PDF has no custom
# logo"). `_lib/report.typ` draws the configured mark left of the title on every exported report,
# with no template change: the same file is read off disk and shipped with the render job as the
# asset `branding/logo.<ext>` (a report cannot fetch a URL -- the sidecar has no egress).
# `logoLight` is what PRINTS, falling back to `logo`: paper is white, `logo` is the dark-theme
# mark, and a white mark on white paper is an empty rectangle.
#
# `name` is the one branding key that needs no volume: a plain string, printed in a report's header
# when no logo is configured or readable. It carries none of the path validation above.
# branding:
#   logo: /tmp/branding/logo.png
#   logoLight: /tmp/branding/logo-light.png
#   style: /tmp/branding/override.style
#   name: adorsys

# ── Permissions (seam only — no engine yet) ───────────────────────────────────────────────────
# Empty on purpose. This is where a lightbridge-authz-style permission model (see that repo's
# oauth2.rbac block in config/default.yaml — role -> permission-grant mapping, `*` /
# `<resource>:*` / `<resource>:<action>` grants) will eventually live once the console grows its
# own RBAC-in-config story, instead of only relying on the backend's own enforcement. Deliberately
# not read by src/server/env.ts yet — wiring up a field nothing consumes would be dormant code, so
# this stays a config seam until there's an engine behind it.
permissions: {}
