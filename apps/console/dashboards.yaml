# Declarative dashboards — converse-frontends#446 (decision D-K).
#
# "The dashboards are basically fetch(filters × type × parameters) = data. The page handles the
# filters; we externalize the list of type × parameters into a dashboards.yaml (per page); Next
# reads those and does the mapping." — owner, 2026-09-02.
#
# One entry per page ROUTE (the same path string the App Router uses). A page declares which
# filters it owns; each panel declares its type, its query, and which metric it reads. Adding a
# panel is adding YAML — never another hand-written container.
#
# Validated against `src/dashboards/dashboard-spec.ts` at startup AND by a unit test
# (`dashboard-spec.test.ts`). An invalid document fails LOUD, naming the page and the panel id —
# the console refuses to start rather than rendering an empty dashboard.
#
# Overridable in production: `${CONSOLE_CONFIG_DIR}/dashboards.yaml` wins over this file when it
# exists (owner ruling Q11), on the same volume the console already mounts `config.yaml` and its
# branding from. An override that exists but is invalid is a hard failure, never a silent fallback
# to this file.
#
# ── SCOPE OF THIS FILE TODAY ─────────────────────────────────────────────────────────────────
# TEN page entries, every one of them complete. C3 shipped the ENGINE and a first `/admin/usage`
# sketch; C4 migrated `/admin/overview` onto it; C5 replaced the sketch with the full
# nineteen-panel `/admin/usage` contract; C6 (converse-frontends#449) added the three DRILL-DOWN
# routes — `/admin/usage/actors/[actorId]`, `/admin/usage/channels/[channelId]` and
# `/admin/usage/chats` — the engine's proof that a PARAMETERISED page needs no code of its own
# either; C12 (converse-frontends#455) brought the account dashboard and all four
# `/settings/overview/*` lenses across and deleted their hand-written containers
# (`use-overview-screen.ts`, `use-settings-overview-screen.ts`, `use-usage-overview-screen.ts`,
# `usage-overview-usage.ts`). **No hand-written dashboard container remains in this console** —
# what is left beside a grid is only what is not a usage query (RPC-backed budget zones, refine
# listings), each named in its page's own comment below.
#
# ── PLACEHOLDERS ─────────────────────────────────────────────────────────────────────────────
# `$name` in any query string field is substituted from the page's own filters (a route param or
# a URL knob). An unresolved placeholder is an ERROR, never an empty string — `scope_id: ""` on an
# account-scoped panel would silently query something other than what the panel's title says.
# `$name?` (C12) is the OPTIONAL form, legal ONLY inside `filters.<key>`: it DROPS the filter when
# the page has no value for it, which is what a project picker sitting on "All projects" needs.
#
# ── SCOPES ───────────────────────────────────────────────────────────────────────────────────
# `scope` is a `UsageScope` (`user`/`api_key`/`project`/`account`/`all`), or the resolver's own
# `family` (C12): one `scope: account` query per account in the SESSION's own account family,
# merged client-side. `family` is what `/settings/overview/usage` means — the accounts this
# identity can see — and is deliberately not `all`, which is the whole deployment and is gated on
# `usage:read-all`.
#
# ── WHICH DIMENSION A PANEL READS ────────────────────────────────────────────────────────────
# By default, its query's FIRST `group_by` entry — which is what lets several panels share one
# request, since the dedupe key sorts the dimensions. `options.dimension` names a different one
# explicitly, and `dimension: none` reads no dimension at all (the ungrouped total). That matters
# most under a `family` fan-out, where a second query shape costs N requests rather than one.
#
# ── BUCKET AND LIMIT ─────────────────────────────────────────────────────────────────────────
# `bucket: auto` resolves from the page's range: ≤7d → 1 hour, ≤90d → 1 day, else 7 days.
# `limit` is ALWAYS explicit (console-ui skill) — never left to a server default.

pages:
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # /admin/overview — the operator dashboard (converse-frontends#447, story C4).
  #
  # These panels ARE the eight boards the hand-written page drew until 2026-09-02. Two zones are
  # deliberately absent and stay hand-written in `admin-overview-centre.tsx`, because neither is a
  # usage query and this file only describes usage queries: dashboard 4's budget pressure (the
  # `getBudgetBalance` RPC, one call per account) and dashboard 5's refill queue depth
  # (`listPendingAugmentationRequests`). Both render in their own `DashboardGrid` above this one,
  # with their honesty captions intact.
  #
  # Request count: eleven panels resolve to THREE usage requests plus the one previous-window twin
  # `compare: true` adds — four. The eight-board page this replaces fired SIX, one per board
  # family, none of them shared. Adding the budget-pressure zone's own billing-period request
  # (one now; it used to be two, current and previous month) the whole page is five where it was
  # six, for three more panels.
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  - route: /admin/overview
    # No route params and no lens toggle — this page is the whole estate, always. `range` (with
    # `from`/`to`) is implicit and never listed.
    filters: []

    panels:
      # ── 1. Estate spend over time ──────────────────────────────────────────────────────────
      - id: estate-spend
        type: series
        title: Total spend vs previous period
        subtitle: Every account with usage in this window. The dashed line is the previous period, laid under this one.
        span: 2
        metric: cost
        compare: true
        options:
          scale: linear
        query:
          scope: all
          bucket: auto
          limit: 2000

      # `group_by` is `[account_id, project_id]` on this panel and on both top-spender tables, not
      # the single dimension each of them actually reads. That is not redundancy — it is what
      # makes them, and all three adoption panels, ONE request. Adding `project_id` beside
      # `account_id` costs nothing in rows either: a project belongs to exactly one account, so
      # the account is functionally determined by the project and the grouping is exactly as
      # coarse as `[project_id]` alone. Which dimension a panel READS is its own first one.
      - id: spend-by-account
        type: series
        title: Spend by account
        subtitle: The twelve highest-spending accounts. Values on hover.
        span: 2
        metric: cost
        options:
          scale: linear
          topN: 12
        query:
          scope: all
          group_by:
            - account_id
            - project_id
          bucket: auto
          limit: 2000

      # ── 2. Model mix ───────────────────────────────────────────────────────────────────────
      # Both halves read the SAME per-model query — one request, two panels.
      - id: model-mix-share
        type: share
        title: Spend by model — estate share
        span: 1
        metric: cost
        query:
          scope: all
          group_by:
            - model
          bucket: auto
          limit: 2000

      - id: spend-by-model
        type: series
        title: Spend by model over time
        subtitle: Log axis by default — one model at ~95% share flattens every other line on a linear one.
        span: 1
        metric: cost
        options:
          scale: log
          topN: 5
        query:
          scope: all
          group_by:
            - model
          bucket: auto
          limit: 2000

      # ── 3. Top spenders ────────────────────────────────────────────────────────────────────
      # Two tables, not one mixed ranking: an account row and a project row lead to different
      # places (`?type=account` vs `?type=project`), and a table has one group-by dimension.
      # `/admin/usage/actors/<id>` ships in C5 — the href here is already the final URL.
      - id: top-spender-accounts
        type: table
        title: Top spenders — accounts
        span: 1
        metric: cost
        options:
          rowLabel: Account
          unit: accounts
          link: /admin/usage/actors/:key?type=account
        query:
          scope: all
          group_by:
            - account_id
            - project_id
          bucket: auto
          limit: 2000

      - id: top-spender-projects
        type: table
        title: Top spenders — projects
        subtitle: Spend the backend attributed to no project is folded into a labelled Unassigned row, never dropped.
        span: 1
        metric: cost
        options:
          rowLabel: Project
          unit: projects
          link: /admin/usage/actors/:key?type=project
        query:
          scope: all
          group_by:
            - project_id
            - account_id
          bucket: auto
          limit: 2000

      # ── 6. Request volume ──────────────────────────────────────────────────────────────────
      # Shares the ungrouped query with panel 1 — same scope, same window, same bucket.
      - id: request-volume
        type: series
        title: Request volume
        subtitle: Error rate is not shown — usage events carry no error/status signal today (lightbridge-authz#597).
        span: 2
        metric: requests
        options:
          scale: indexed
        query:
          scope: all
          bucket: auto
          limit: 2000

      # ── 7. Latency ─────────────────────────────────────────────────────────────────────────
      - id: latency-by-model
        type: latency-cards
        title: Latency by model
        subtitle: Percentiles are computed per bucket by the usage backend; each card states the WORST bucket in this window, never an average of percentiles. p99 is hidden below 100 samples.
        span: 2
        metric: latency
        query:
          scope: all
          group_by:
            - model
          bucket: auto
          limit: 2000

      # ── 8. Adoption ────────────────────────────────────────────────────────────────────────
      # All three panels here resolve to ONE request. `group_by` is order-INSENSITIVE for the
      # dedupe key (`queryKey` sorts it) but order-SENSITIVE for a distinct count: a
      # `derived:activeActors` stat counts its query's FIRST dimension. So listing the same two
      # dimensions in a different order gives two different counts off one shared response, which
      # is exactly what "identical queries are deduplicated" is supposed to buy.
      - id: active-accounts
        type: stat
        title: Active accounts
        subtitle: Only counts accounts with usage in this window — an account with zero usage never appears in an estate-wide usage query at all.
        span: 1
        metric: derived:activeActors
        query:
          scope: all
          group_by:
            - account_id
            - project_id
          bucket: auto
          limit: 2000

      - id: active-projects
        type: stat
        title: Active projects
        subtitle: Same window and the same limit; spend attributed to no project is not counted as one.
        span: 1
        metric: derived:activeActors
        query:
          scope: all
          group_by:
            - project_id
            - account_id
          bucket: auto
          limit: 2000

      - id: adoption-over-time
        type: series
        title: Active accounts & projects per day
        subtitle: Distinct accounts and projects with at least one request in each bucket.
        span: 2
        metric: derived:activeActorsPerBucket
        options:
          scale: linear
        query:
          scope: all
          group_by:
            - account_id
            - project_id
          bucket: auto
          limit: 2000

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # /admin/usage — the estate's usage surface (converse-frontends#448, story C5).
  #
  # NINETEEN panels, and the whole page is this entry plus a route file that renders
  # `useDashboard('/admin/usage')` into `DashboardGrid`. There is no per-panel query code anywhere
  # in `apps/console` for this page — that claim is the point of the slice, and
  # `admin-usage-page.test.ts` checks it from the data side while `Pages/AdminUsage` does from the
  # visual one.
  #
  # ── THE PANEL IDS ARE A CROSS-SLICE CONTRACT ───────────────────────────────────────────────
  # C6 reuses them on the actor/channel/chat routes, C10's report renderer walks them, and C11
  # documents them. They are not renamed casually. `admin-usage-page.test.ts` pins the exact list,
  # in order, so a rename is a failing test rather than a quiet break in three other slices.
  #
  # ── LENS ───────────────────────────────────────────────────────────────────────────────────
  # `lens` is this page's own knob (`?lens=user|account|project`, USER FIRST — the owner's
  # actor-identity rule). A panel that declares `options.lens` has the first dimension of its
  # `group_by` swapped for that lens's own (`user_id`/`account_id`/`project_id`) and `$lens` in its
  # `options.link` resolved to the same value. That is why the five lens-driven panels below all
  # say `group_by: [user_id]`: it is the honest DEFAULT, readable on its own, not a placeholder.
  #
  # ── REQUEST COUNT ──────────────────────────────────────────────────────────────────────────
  # Nineteen panels resolve to SIX usage requests plus one comparison twin — seven:
  #   1. the ungrouped estate query (total cost, total requests, avg cost/MTok)
  #   2. its previous-window twin (`compare: true` on the two totals)
  #   3. `[account_id, billing_plan]`  (accounts-by-plan, plan-in-use)
  #   4. `[user_id]` under the current lens (active actors, cost/tokens by actor, top actor cost,
  #      actors table — five panels, one request)
  #   5. `[model]` (cost/tokens by model, model cost share, all three model-distribution rings)
  #   6. `[azp]` (cost by channel, channels table)
  #   7. the ungrouped estate query filtered to the three chat operations (chat completions count)
  # Nineteen hand-written containers would have fired nineteen.
  #
  # ── LIMITS ─────────────────────────────────────────────────────────────────────────────────
  # Every panel sets `limit` explicitly, and it bounds the BUCKET count (lightbridge-authz#578),
  # not the row count. A response the backend had to truncate sets `truncated: true` and the panel
  # renders a caption naming this number — never a quietly short chart.
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  - route: /admin/usage
    # `range` is implicit on every page and never listed. `lens` is this page's own.
    filters:
      - lens

    panels:
      # ── 1-2. The two totals, each against the previous comparison window (D-F) ─────────────
      # Both share ONE ungrouped request with panel 5; only the twin below is extra.
      - id: total-cost
        type: stat
        title: Total cost
        subtitle: Every account with usage in this window
        span: 1
        metric: cost
        compare: true
        query:
          scope: all
          bucket: auto
          limit: 2000

      - id: total-requests
        type: stat
        title: Total requests
        subtitle: Error rate is not shown — usage events carry no error/status signal (lightbridge-authz#597).
        span: 1
        metric: requests
        compare: true
        query:
          scope: all
          bucket: auto
          limit: 2000

      # ── 3. Accounts with usage, per billing plan (owner Q4, confirmed) ─────────────────────
      # `derived:activeActors` on a `stat-group` counts DISTINCT values of the FIRST dimension,
      # broken down by the SECOND. The cards do not sum to the estate's account count and no total
      # is printed: one account can appear under two plans in a window, because a plan change
      # mid-month is a real event.
      - id: accounts-by-plan
        type: stat-group
        title: Accounts with usage, by plan
        subtitle: Distinct accounts that drew something in this window. An account with no usage never appears in a usage query at all, so this is not a census of the estate.
        span: 2
        metric: derived:activeActors
        options:
          topN: 6
        query:
          scope: all
          group_by:
            - account_id
            - billing_plan
          bucket: auto
          limit: 2000

      # ── 4. Which plans the spend is on ────────────────────────────────────────────────────
      # Shares panel 3's request — same two dimensions, read from the other end.
      - id: plan-in-use
        type: ranked
        title: Plans in use
        subtitle: Cost per billing plan, ranked.
        span: 1
        metric: cost
        options:
          topN: 6
        query:
          scope: all
          group_by:
            - billing_plan
            - account_id
          bucket: auto
          limit: 2000

      # ── 5. Average cost per million tokens ────────────────────────────────────────────────
      - id: avg-cost-per-million-tokens
        type: stat
        title: Average cost per million tokens
        subtitle: A dash, not $0.00, when the window carries no token counts — an embeddings or image call has none, and "free" would be a fabricated reading.
        span: 1
        metric: derived:avgCostPerMillionTokens
        query:
          scope: all
          bucket: auto
          limit: 2000

      # ── 6. Active actors ──────────────────────────────────────────────────────────────────
      # A distinct count needs the dimension it counts as a group key, so this is NOT the ungrouped
      # query above — it is the head of the lens-driven family, and shares its request with panels
      # 8, 10, 13 and 18.
      - id: active-actors
        type: stat
        title: Active actors
        subtitle: Only counts actors with usage in this window. Follows the lens.
        span: 1
        metric: derived:activeActors
        options:
          lens: user
        query:
          scope: all
          group_by:
            - user_id
          bucket: auto
          limit: 2000

      # ── 7. Cost per period by model ───────────────────────────────────────────────────────
      # Log by default: one model at ~95% share flattens every other line on a linear axis. The
      # axis is a URL knob (`?cost-by-model-scale=`), so this is only the default.
      - id: cost-by-model
        type: series
        title: Cost per period by model
        subtitle: Top five models plus the tail. Log axis by default — one dominant model flattens every other line on a linear one.
        span: 2
        metric: cost
        options:
          scale: log
          topN: 5
        query:
          scope: all
          group_by:
            - model
          bucket: auto
          limit: 2000

      # ── 8. Cost per period by actor (lens-driven) ─────────────────────────────────────────
      - id: cost-by-actor
        type: series
        title: Cost per period by actor
        subtitle: Follows the lens above — users, accounts or projects.
        span: 2
        metric: cost
        options:
          scale: linear
          topN: 6
          lens: user
        query:
          scope: all
          group_by:
            - user_id
          bucket: auto
          limit: 2000

      # ── 9-10. The same two readings in TOKENS ─────────────────────────────────────────────
      # Both share their cost twin's request: same scope, same window, same grouping — only the
      # column each reads off a point differs.
      - id: tokens-by-model
        type: series
        title: Tokens per period by model
        span: 1
        metric: tokens
        options:
          scale: log
          topN: 5
        query:
          scope: all
          group_by:
            - model
          bucket: auto
          limit: 2000

      - id: tokens-by-actor
        type: series
        title: Tokens per period by actor
        span: 1
        metric: tokens
        options:
          scale: linear
          topN: 6
          lens: user
        query:
          scope: all
          group_by:
            - user_id
          bucket: auto
          limit: 2000

      # ── 11. Cost by channel (azp) ─────────────────────────────────────────────────────────
      # `azp` is one of lane A3's bridge columns (lightbridge-authz#648/PR#652): the OAuth client
      # the request arrived on. Rows are real anchors into C6's channel route.
      - id: cost-by-channel
        type: ranked
        title: Cost by channel
        subtitle: Which OAuth client the spend arrived on. Rows open the channel.
        span: 1
        metric: cost
        options:
          topN: 8
          link: /admin/usage/channels/:key
        query:
          scope: all
          group_by:
            - azp
          bucket: auto
          limit: 2000

      # ── 12. Which models (cost share) ─────────────────────────────────────────────────────
      # The ONE `share` on this page — ShareBar keeps the single sanctioned part-to-whole job it
      # was given on 2026-08-29 (ADR 0013 D5).
      - id: model-cost-share
        type: share
        title: Which models
        subtitle: Cost share across the window
        span: 1
        metric: cost
        query:
          scope: all
          group_by:
            - model
          bucket: auto
          limit: 2000

      # ── 13. Top actors by cost (lens-driven, links out) ───────────────────────────────────
      # `$lens` in the link resolves to the effective lens, so a row always lands on the actor page
      # with the right `?type=`.
      - id: top-actor-cost
        type: ranked
        title: Top actors by cost
        subtitle: Rows open that actor's own usage. Follows the lens.
        span: 1
        metric: cost
        options:
          topN: 8
          lens: user
          link: /admin/usage/actors/:key?type=$lens
        query:
          scope: all
          group_by:
            - user_id
          bucket: auto
          limit: 2000

      # ── 14. Chat completions ──────────────────────────────────────────────────────────────
      # `operation_in` is the backend's one set-membership filter (lightbridge-authz#648): the
      # console's chat question is inherently three-valued, and three separate queries would triple
      # the load AND disagree with themselves whenever a bucket boundary fell differently between
      # them. Its own request, because a filtered query is a different question.
      - id: chat-completions-count
        type: stat
        title: Chat completions
        subtitle: Requests on the chat-shaped surfaces — /v1/chat/completions, /v1/responses and /v1/messages.
        span: 1
        metric: derived:chatCount
        query:
          scope: all
          filters:
            operation_in:
              - chat_completions
              - responses
              - messages
          bucket: auto
          limit: 2000

      # ── 15-17. Model distribution — three RINGS ───────────────────────────────────────────
      # Owner ruling, 2026-09-02, amending ADR 0013 D5: "rings allowed, filled disks never." All
      # three share the `[model]` request panels 7, 9 and 12 already issue; only which column each
      # reads differs, which is the whole reason they are three panels rather than one with a
      # metric toggle — a toggle would hide two of the three readings behind a click.
      - id: model-distribution-requests
        type: donut
        title: Model distribution — requests
        # NOT "values on hover": a `subtitle` is rendered by the screen AND by the report
        # (converse-frontends#453), and paper has no pointer. On screen the values are in the
        # tooltip; in the PDF they are in the panel's own table.
        subtitle: Requests by model
        span: 1
        metric: requests
        options:
          topN: 6
        query:
          scope: all
          group_by:
            - model
          bucket: auto
          limit: 2000

      - id: model-distribution-cost
        type: donut
        title: Model distribution — cost
        span: 1
        metric: cost
        options:
          topN: 6
        query:
          scope: all
          group_by:
            - model
          bucket: auto
          limit: 2000

      - id: model-distribution-tokens
        type: donut
        title: Model distribution — tokens
        span: 1
        metric: tokens
        options:
          topN: 6
        query:
          scope: all
          group_by:
            - model
          bucket: auto
          limit: 2000

      # ── 18. Actors table ──────────────────────────────────────────────────────────────────
      # Sorting and paging are CLIENT-SIDE over the grouped response, because the query API has no
      # ordering and no offset (owner-accepted, provided the truncation caption stays visible
      # beside the table). Both are URL knobs, so a sorted page is a shareable link.
      - id: actors-table
        type: table
        title: Actors
        subtitle: Cost, requests, tokens and last activity per actor. Rows open that actor. Last activity is the start of the most recent bucket with usage, not an event timestamp.
        span: 2
        metric: cost
        options:
          lens: user
          rowLabel: Actor
          unit: actors
          columns:
            - label
            - type
            - cost
            - requests
            - tokens
            - lastActive
          link: /admin/usage/actors/:key?type=$lens
        query:
          scope: all
          group_by:
            - user_id
          bucket: auto
          limit: 2000

      # ── 19. Channels table ────────────────────────────────────────────────────────────────
      # No token column: a channel is an OAuth client, and "tokens per client" is a reading of the
      # models it called, not of the client. Shares panel 11's request.
      - id: channels-table
        type: table
        title: Channels
        subtitle: Cost and requests per OAuth client. Rows open the channel.
        span: 2
        metric: cost
        options:
          rowLabel: Channel
          unit: channels
          columns:
            - label
            - cost
            - requests
          link: /admin/usage/channels/:key
        query:
          scope: all
          group_by:
            - azp
          bucket: auto
          limit: 2000

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # /admin/usage/actors/[actorId] — ONE actor's own usage (converse-frontends#449, story C6).
  #
  # This entry is the proof that the engine handles PARAMETERISED pages, not just static ones:
  # there is no per-actor container anywhere in `apps/console`, and no panel type this page
  # introduced. Every panel is a type C3 shipped and a shape C5 already draws estate-wide; what
  # differs is two `$param` placeholders.
  #
  # ── THE PLACEHOLDERS ───────────────────────────────────────────────────────────────────────
  # `scope: $type` and `scope_id: $actorId`. `$type` is the closed usage-scope enum
  # (`user|account|project`) and `resolve-dashboard.ts` validates the SUBSTITUTED value against it
  # — a `?type=everything` cannot reach the backend as a malformed scope with an actor's name
  # already printed above it. An unresolved placeholder throws rather than substituting an empty
  # string: `scope_id: ""` under `scope: account` is not "no actor", it is a query that would
  # return something other than what every title on this page claims.
  #
  # The route itself 404s an invalid or missing `?type=` before any markup is generated. An
  # unresolved LABEL is a different matter entirely and is NOT a 404 — an id with real usage rows
  # keeps its data under a labelled sentinel header (an explicit AC).
  #
  # ── PANEL IDS ──────────────────────────────────────────────────────────────────────────────
  # Prefixed `actor-`. They are the same panel TYPES and the same readings as `/admin/usage`'s,
  # but a distinct identity per page is what keeps three things unambiguous: C10's report walk
  # (`/api/reports/page` resolves a route to a panel list), the per-panel URL knobs
  # (`?<panel-id>-scale=`), and this file's own cross-page reading.
  # `admin-usage-detail-pages.test.ts` pins the list, in order.
  #
  # ── REQUEST COUNT ──────────────────────────────────────────────────────────────────────────
  # Nine panels resolve to FIVE requests:
  #   1. the ungrouped actor query (total cost, total requests)
  #   2. its previous-window twin (`compare: true` on both totals)
  #   3. `[model]` (cost by model, model cost share, all three distribution rings)
  #   4. `[azp]` (cost by channel)
  #   5. the ungrouped actor query filtered to the three chat operations
  #
  # ── THE BUDGET ZONE ────────────────────────────────────────────────────────────────────────
  # `type=account` additionally renders a hand-written "Budget & next reset" zone above this grid
  # (`admin-usage-actor-centre.tsx`). It is deliberately NOT a panel: it reads `getBudgetBalance`
  # and `getEffectiveResetSchedule`, both RPCs, over the BILLING PERIOD rather than the page's
  # range — the same two reasons `/admin/overview`'s budget-pressure zone stays hand-written.
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  - route: /admin/usage/actors/[actorId]
    # Both are ROUTE params rather than view knobs, and both are required. `range` is implicit.
    filters:
      - actorId
      - type

    panels:
      # ── The two totals, against the previous comparison window (D-F) ──────────────────────
      # The cadence is the ACCOUNT's own effective reset schedule when `type=account`, and the
      # global/monthly rule otherwise — resolved by the container, applied by the engine.
      # The RANGE PICKER's window, not the billing period the "Budget & next reset" zone beside
      # it reads (`use-actor-budget.ts`) — a ceiling is a fact about a reset period and this is a
      # fact about the window on screen. The two agree whenever the picker is on `mtd`, and the
      # subtitles say which is which; they disagreed catastrophically until #448, when the engine
      # was silently widening this panel's window to a seven-day floor.
      - id: actor-total-cost
        type: stat
        title: Total cost
        subtitle: This actor's own spend in the window picked above, not in the budget period.
        span: 1
        metric: cost
        compare: true
        query:
          scope: $type
          scope_id: $actorId
          bucket: auto
          limit: 2000

      - id: actor-total-requests
        type: stat
        title: Total requests
        subtitle: Error rate is not shown — usage events carry no error/status signal (lightbridge-authz#597).
        span: 1
        metric: requests
        compare: true
        query:
          scope: $type
          scope_id: $actorId
          bucket: auto
          limit: 2000

      # ── What this actor spends it on ──────────────────────────────────────────────────────
      - id: actor-cost-by-model
        type: series
        title: Cost per period by model
        subtitle: Log axis by default — one dominant model flattens every other line on a linear one.
        span: 2
        metric: cost
        options:
          scale: log
          topN: 5
        query:
          scope: $type
          scope_id: $actorId
          group_by:
            - model
          bucket: auto
          limit: 2000

      # ── Where it arrives from ─────────────────────────────────────────────────────────────
      # Rows are real anchors into the channel page — the drill path continues rather than
      # dead-ending at the actor.
      - id: actor-cost-by-channel
        type: ranked
        title: Cost by channel
        subtitle: Which OAuth client this actor's spend arrived on. Rows open the channel.
        span: 1
        metric: cost
        options:
          topN: 8
          link: /admin/usage/channels/:key
        query:
          scope: $type
          scope_id: $actorId
          group_by:
            - azp
          bucket: auto
          limit: 2000

      - id: actor-model-cost-share
        type: share
        title: Which models
        subtitle: Cost share across the window
        span: 1
        metric: cost
        query:
          scope: $type
          scope_id: $actorId
          group_by:
            - model
          bucket: auto
          limit: 2000

      - id: actor-chat-completions-count
        type: stat
        title: Chat completions
        subtitle: Requests on the chat-shaped surfaces — /v1/chat/completions, /v1/responses and /v1/messages.
        span: 1
        metric: derived:chatCount
        query:
          scope: $type
          scope_id: $actorId
          filters:
            operation_in:
              - chat_completions
              - responses
              - messages
          bucket: auto
          limit: 2000

      # ── Model distribution — three RINGS ──────────────────────────────────────────────────
      # Owner ruling, 2026-09-02, amending ADR 0013 D5: "rings allowed, filled disks never." All
      # three share the `[model]` request the two panels above already issue.
      - id: actor-model-distribution-requests
        type: donut
        title: Model distribution — requests
        subtitle: Requests by model
        span: 1
        metric: requests
        options:
          topN: 6
        query:
          scope: $type
          scope_id: $actorId
          group_by:
            - model
          bucket: auto
          limit: 2000

      - id: actor-model-distribution-cost
        type: donut
        title: Model distribution — cost
        span: 1
        metric: cost
        options:
          topN: 6
        query:
          scope: $type
          scope_id: $actorId
          group_by:
            - model
          bucket: auto
          limit: 2000

      - id: actor-model-distribution-tokens
        type: donut
        title: Model distribution — tokens
        span: 1
        metric: tokens
        options:
          topN: 6
        query:
          scope: $type
          scope_id: $actorId
          group_by:
            - model
          bucket: auto
          limit: 2000

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # /admin/usage/channels/[channelId] — ONE OAuth client's usage (converse-frontends#449, C6).
  #
  # A channel is NOT a usage scope: the backend's scope enum knows users, projects, accounts, API
  # keys and the estate, and nothing else. So every panel here is `scope: all` narrowed by the
  # EQUALITY FILTER `azp: $channelId` — lane A3's bridge column (lightbridge-authz#648). That is
  # also why this page needs `usage:read-all` exactly as the estate page does: it is an estate
  # query with one more filter on it, not a narrower permission.
  #
  # ── REQUEST COUNT ──────────────────────────────────────────────────────────────────────────
  # Seven panels resolve to SIX requests: the ungrouped channel query (both totals), its
  # comparison twin, `[model]` (series + share), the chat-filtered query, `[user_id]` and
  # `[operation]`. Nothing shares beyond those two pairs because each of the last three asks a
  # genuinely different question.
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  - route: /admin/usage/channels/[channelId]
    filters:
      - channelId

    panels:
      - id: channel-total-cost
        type: stat
        title: Total cost
        subtitle: Spend that arrived on this OAuth client, across every account.
        span: 1
        metric: cost
        compare: true
        query:
          scope: all
          filters:
            azp: $channelId
          bucket: auto
          limit: 2000

      - id: channel-total-requests
        type: stat
        title: Total requests
        subtitle: Error rate is not shown — usage events carry no error/status signal (lightbridge-authz#597).
        span: 1
        metric: requests
        compare: true
        query:
          scope: all
          filters:
            azp: $channelId
          bucket: auto
          limit: 2000

      - id: channel-cost-by-model
        type: series
        title: Cost per period by model
        subtitle: Log axis by default — one dominant model flattens every other line on a linear one.
        span: 2
        metric: cost
        options:
          scale: log
          topN: 5
        query:
          scope: all
          group_by:
            - model
          filters:
            azp: $channelId
          bucket: auto
          limit: 2000

      - id: channel-model-cost-share
        type: share
        title: Which models
        subtitle: Cost share across the window
        span: 1
        metric: cost
        query:
          scope: all
          group_by:
            - model
          filters:
            azp: $channelId
          bucket: auto
          limit: 2000

      - id: channel-chat-completions-count
        type: stat
        title: Chat completions
        subtitle: Requests on the chat-shaped surfaces — /v1/chat/completions, /v1/responses and /v1/messages.
        span: 1
        metric: derived:chatCount
        query:
          scope: all
          filters:
            azp: $channelId
            operation_in:
              - chat_completions
              - responses
              - messages
          bucket: auto
          limit: 2000

      # ── Who is on this channel ────────────────────────────────────────────────────────────
      # Always USERS, never a lens: this page has no lens knob, and a channel is a client people
      # sign in through — "which accounts use the CLI" is a question the estate page's own lens
      # already answers. Rows link back to the actor page with the matching `?type=user`.
      - id: channel-actors
        type: ranked
        title: Actors on this channel
        subtitle: Cost per user on this client. Rows open that actor.
        span: 1
        metric: cost
        options:
          topN: 8
          link: /admin/usage/actors/:key?type=user
        query:
          scope: all
          group_by:
            - user_id
          filters:
            azp: $channelId
          bucket: auto
          limit: 2000

      # ── What it is used FOR ───────────────────────────────────────────────────────────────
      # `operation` is A3's derived column: the request path folded into a closed vocabulary
      # (chat_completions / responses / messages / embeddings / other). The wire values are
      # snake_case and the rows are humanised by `panel-adapters.tsx`, in one place.
      - id: channel-requests-by-operation
        type: ranked
        title: Requests by operation
        subtitle: Which API surface this client calls.
        span: 2
        metric: requests
        options:
          topN: 6
        query:
          scope: all
          group_by:
            - operation
          filters:
            azp: $channelId
          bucket: auto
          limit: 2000

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # /admin/usage/chats — the chat-shaped operations across the estate (C6).
  #
  # ── ONE QUERY PER PANEL, NOT THREE ─────────────────────────────────────────────────────────
  # Every panel carries `operation_in: [chat_completions, responses, messages]`, A3's single
  # set-membership filter (lightbridge-authz#648). Three equality queries unioned in the browser
  # would triple the load AND disagree with themselves whenever a bucket boundary fell differently
  # between them — and a latency percentile cannot be unioned at all.
  #
  # ── THE LATENCY SERIES IS HONEST, AND THIS IS WHY ──────────────────────────────────────────
  # ADR 0013 D5 limited latency to stat cards "until history depth justifies a series". That limit
  # is amended here (C11 carries the write-up): the usage backend computes `percentile_cont` PER
  # BUCKET GROUP at query time, so each plotted point is a real percentile of that bucket's own
  # samples — not an interpolation between window aggregates, and not an average of percentiles,
  # which is not a percentile of anything. `latency-cards` still states the window's WORST bucket
  # rather than a mean, for the same reason.
  #
  # ── REQUEST COUNT ──────────────────────────────────────────────────────────────────────────
  # Five panels resolve to FOUR requests: the ungrouped chat query (latency series + the count),
  # its comparison twin, `[model]` (latency cards + cost by model), and `[operation]`.
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  - route: /admin/usage/chats
    # No route params and no lens — this page is the estate's chat traffic, always.
    filters: []

    panels:
      # ── Latency over time, p50 and p95 ────────────────────────────────────────────────────
      # UNGROUPED on purpose: the two lines are the two PERCENTILES, not two models. A grouped
      # latency series would plot one p50 line per model and drop p95 entirely, which is the
      # reading `latency-cards` below already gives per model.
      - id: chat-latency-series
        type: latency-series
        title: Chat latency over time
        subtitle: p50 and p95 per bucket, computed by the usage backend at query time — never an average of percentiles. No TTFT is emitted by the gateway, so first-token latency is absent rather than estimated.
        span: 2
        metric: latency
        options:
          scale: linear
        query:
          scope: all
          filters:
            operation_in:
              - chat_completions
              - responses
              - messages
          bucket: auto
          limit: 2000

      - id: chat-latency-cards
        type: latency-cards
        title: Latency by model
        subtitle: Each card states the WORST bucket in this window, never an average of percentiles. p99 is hidden below 100 samples.
        span: 2
        metric: latency
        query:
          scope: all
          group_by:
            - model
          filters:
            operation_in:
              - chat_completions
              - responses
              - messages
          bucket: auto
          limit: 2000

      # ── How many ──────────────────────────────────────────────────────────────────────────
      # `metric: requests`, not `derived:chatCount`: every query on this page is ALREADY filtered
      # to the three chat surfaces, so a request here IS a chat request — and unlike the derived
      # count, a plain metric carries an honest previous-window delta. The estate page's own
      # `chat-completions-count` stat keeps `derived:chatCount` because its page is unfiltered and
      # the panel is what does the narrowing.
      - id: chat-total-count
        type: stat
        title: Chat requests
        subtitle: Requests on /v1/chat/completions, /v1/responses and /v1/messages.
        span: 1
        metric: requests
        compare: true
        query:
          scope: all
          filters:
            operation_in:
              - chat_completions
              - responses
              - messages
          bucket: auto
          limit: 2000

      - id: chat-requests-by-operation
        type: series
        title: Requests per period by operation
        subtitle: The three chat surfaces plotted apart — a migration from one to another is visible here and nowhere else.
        span: 1
        metric: requests
        options:
          scale: linear
          topN: 3
        query:
          scope: all
          group_by:
            - operation
          filters:
            operation_in:
              - chat_completions
              - responses
              - messages
          bucket: auto
          limit: 2000

      - id: chat-cost-by-model
        type: series
        title: Chat cost per period by model
        subtitle: Log axis by default — one dominant model flattens every other line on a linear one.
        span: 2
        metric: cost
        options:
          scale: log
          topN: 5
        query:
          scope: all
          group_by:
            - model
          filters:
            operation_in:
              - chat_completions
              - responses
              - messages
          bucket: auto
          limit: 2000

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # /accounts/[accountId]/overview — the account-scoped user dashboard (converse-frontends#455,
  # story C12).
  #
  # These panels ARE the boards `overview-centre.tsx` drew by hand until 2026-09-02 (spend over
  # time with its previous-period overlay, the per-project breakdown, the by-model board), plus
  # the two the toolbar's `?group-by=` knob used to reach — by API key, and the model share —
  # which are now their own panels rather than one board changing shape under a select.
  #
  # **What stays hand-written, and why.** `dashboards.yaml` describes usage queries. The BUDGET
  # card reads `getMyBudgetBalance` (an RPC) against BILLING-PERIOD consumption that must not
  # follow the range picker, and the stat row beside it counts projects and active API keys
  # through refine. None of those is a usage query, so none is a panel — the same line
  # `/admin/overview` draws for its budget-pressure zone. They render in their own grid ABOVE this
  # one, with the honesty caption that says which window they are about.
  #
  # Request count: eleven panels resolve to FIVE requests — the ungrouped one (three panels), its
  # comparison twin, one `[project_id, model]` grouping (four panels, each reading its own
  # dimension), one by-API-key grouping, and one `[azp]` grouping shared by the three channel
  # rings. The hand-written page fired four for three boards, and none of them were shared.
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  - route: /accounts/[accountId]/overview
    # `accountId` is the route segment; `project` is the console-wide `?project=` scope, whose
    # neutral position is "All projects" — hence the OPTIONAL `$project?` placeholder below, which
    # drops the filter entirely rather than sending an empty one.
    filters:
      - accountId
      - project

    panels:
      # ── the money-first pair ────────────────────────────────────────────────────────────────
      # Both read the SAME ungrouped query as the chart below, and both carry the D-F comparison,
      # so the delta's wording names the window it compared against BY DATE
      # ("12% vs Aug 1 – Aug 31") instead of the vague "vs prev period" the deleted per-container
      # helpers used.
      - id: spend-total
        type: stat
        title: Spend in this range
        subtitle: The range picked above, not the budget period the BUDGET card states.
        span: 1
        metric: cost
        compare: true
        query:
          scope: account
          scope_id: $accountId
          filters:
            project_id: $project?
          bucket: auto
          limit: 2000

      - id: request-total
        type: stat
        title: Requests in this range
        span: 1
        metric: requests
        compare: true
        query:
          scope: account
          scope_id: $accountId
          filters:
            project_id: $project?
          bucket: auto
          limit: 2000

      # ── spend over time ─────────────────────────────────────────────────────────────────────
      # UNGROUPED, deliberately: it plots the account TOTAL, summing every project/model/key
      # including spend the backend attributed to nothing. It used to plot one line per project
      # while silently dropping every unassigned point (often 88-99% of real spend), which is what
      # made this chart and the estate overview's own draw different curves for the same account
      # (owner finding, 2026-08-31). The dashed line is the previous period, re-based forward so
      # the two overlay.
      - id: spend-over-time
        type: series
        title: Spend over time
        subtitle: The account total, with the previous period dashed underneath it.
        span: 2
        metric: cost
        compare: true
        options:
          scale: linear
        query:
          scope: account
          scope_id: $accountId
          filters:
            project_id: $project?
          bucket: auto
          limit: 2000

      # ── the breakdowns ──────────────────────────────────────────────────────────────────────
      # One `[project_id, model]` query serves all four panels below: each declares which
      # dimension it READS (`options.dimension`), and the request is interned once.
      - id: spend-by-project
        type: ranked
        title: Spend by project
        subtitle: Spend the backend attributed to no project is a labelled Unassigned row, never dropped.
        span: 1
        metric: cost
        options:
          dimension: project_id
          topN: 6
        query:
          scope: account
          scope_id: $accountId
          group_by:
            - project_id
            - model
          filters:
            project_id: $project?
          bucket: auto
          limit: 2000

      - id: model-share
        type: share
        title: Spend by model — share
        span: 1
        metric: cost
        options:
          dimension: model
          topN: 5
        query:
          scope: account
          scope_id: $accountId
          group_by:
            - project_id
            - model
          filters:
            project_id: $project?
          bucket: auto
          limit: 2000

      - id: spend-by-model
        type: series
        title: Spend by model over time
        subtitle: Log axis by default — one model at ~100% share flattens every other line on a linear one.
        span: 2
        metric: cost
        options:
          dimension: model
          scale: log
          topN: 5
        query:
          scope: account
          scope_id: $accountId
          group_by:
            - project_id
            - model
          filters:
            project_id: $project?
          bucket: auto
          limit: 2000

      - id: latency-by-model
        type: latency-cards
        title: Latency by model
        subtitle: Percentiles are computed per bucket by the usage backend; each card states the WORST bucket in this window, never an average of percentiles. p99 is hidden below 100 samples.
        span: 1
        metric: latency
        options:
          dimension: model
        query:
          scope: account
          scope_id: $accountId
          group_by:
            - project_id
            - model
          filters:
            project_id: $project?
          bucket: auto
          limit: 2000

      # Its own request: an api-key grouping crossed with the two above would multiply the row
      # count past the limit on any account with a real number of keys.
      - id: spend-by-api-key
        type: ranked
        title: Spend by API key
        subtitle: Spend the backend attributed to no key is a labelled Unassigned row.
        span: 1
        metric: cost
        options:
          dimension: api_key_id
          topN: 6
        query:
          scope: account
          scope_id: $accountId
          group_by:
            - api_key_id
          filters:
            project_id: $project?
          bucket: auto
          limit: 2000

      # ── the three channel RINGS ─────────────────────────────────────────────────────────────
      # Owner request, 2026-09-03: "/accounts/:id/overview is missing three pie-charts: cost by
      # channels, tokens by channels, requests by channels." Rings, never filled disks — the same
      # owner ruling (2026-09-02) that amended ADR 0013 D5 and that `/admin/usage`'s own three
      # model-distribution rings already follow.
      #
      # All three share ONE `[azp]` request: only which column each READS differs, which is the
      # whole reason they are three panels rather than one with a metric toggle — a toggle would
      # hide two of the three readings behind a click. Adding them takes this page from four
      # requests to five.
      #
      # **`azp` is a raw OAuth client id and stays one.** It is not an actor dimension, so
      # `labelOf` finds no `resolveActorLabels` kind and no closed vocabulary for it and prints the
      # value verbatim — exactly what `/admin/usage`'s `cost-by-channel` ranked panel does. Client
      # ids are already human-chosen strings (`console-ui`, `opencode-cli`); title-casing them
      # would invent a name the deployment never configured. Spend the gateway attributed to no
      # client keeps its labelled `Unassigned` segment rather than being dropped.
      #
      # **Rows link to nothing, deliberately.** `/admin/usage/channels/<azp>` is gated on
      # `usage:read-all`, which the readers of this page do not hold — a segment that opened a 404
      # would be worse than one that opens nothing.
      - id: account-cost-by-channel
        type: donut
        title: Cost by channel
        subtitle: Which OAuth client (azp) the spend arrived on. Values are in the tooltip on screen, and in the panel's own table in an exported report.
        span: 1
        metric: cost
        options:
          topN: 6
        query:
          scope: account
          scope_id: $accountId
          group_by:
            - azp
          filters:
            project_id: $project?
          bucket: auto
          limit: 2000

      - id: account-tokens-by-channel
        type: donut
        title: Tokens by channel
        subtitle: Tokens by OAuth client (azp) — the same window and the same request as the cost ring.
        span: 1
        metric: tokens
        options:
          topN: 6
        query:
          scope: account
          scope_id: $accountId
          group_by:
            - azp
          filters:
            project_id: $project?
          bucket: auto
          limit: 2000

      - id: account-requests-by-channel
        type: donut
        title: Requests by channel
        subtitle: Requests by OAuth client (azp) — a channel can be a large share of the calls and a small share of the cost.
        span: 1
        metric: requests
        options:
          topN: 6
        query:
          scope: account
          scope_id: $accountId
          group_by:
            - azp
          filters:
            project_id: $project?
          bucket: auto
          limit: 2000

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # /settings/overview/usage — the operator's own ACCOUNT FAMILY overview (converse-frontends#455,
  # story C12). The landing lens under "Overview" in the settings area.
  #
  # **This page is a `scope: family` FAN-OUT, and that is the whole design decision here.** It is
  # NOT `scope: all`: that scope is the estate (every account on the deployment) and is gated on
  # `usage:read-all`, which most signed-in people do not hold — `/admin/overview` is the page that
  # asks that question. What this page has always shown is the accounts the signed-in identity can
  # actually see, and the usage API has no scope for "every account I can see" (filed as
  # lightbridge-authz#578). So the resolver expands each panel below into one `scope: account`
  # query per family account — capped, and the cap stated in the page's own caption — and merges
  # the responses before the adapters see them. That is exactly what `use-usage-overview-screen.ts`
  # did by hand; it is YAML now.
  #
  # **Every panel shares ONE `[account_id, model]` grouping, on purpose.** Under a fan-out each
  # distinct query shape costs N requests rather than one, so a second, ungrouped fan-out for the
  # family total would have doubled the page's request count. `options.dimension` is what makes one
  # grouping serve all six panels: `account_id` for the by-account board, `model` for the share,
  # `none` for the family total. Request count is therefore the fan-out plus its comparison twin —
  # the same 25 + 25 the hand-written screen fired, for three more panels.
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  - route: /settings/overview/usage
    # No route params: the family is a fact about the session, not about the URL. The account cap
    # and its caption belong to the page, not to a panel.
    filters: []

    panels:
      - id: family-requests
        type: stat
        title: Requests
        span: 1
        metric: requests
        query:
          scope: family
          group_by:
            - account_id
            - model
          bucket: auto
          limit: 2000

      - id: family-cost
        type: stat
        title: Cost
        span: 1
        metric: cost
        compare: true
        query:
          scope: family
          group_by:
            - account_id
            - model
          bucket: auto
          limit: 2000

      - id: family-cost-per-request
        type: stat
        title: Cost / request
        subtitle: Blank when the window carries no requests at all — a mean over nothing is not a number.
        span: 1
        metric: derived:costPerRequest
        query:
          scope: family
          group_by:
            - account_id
            - model
          bucket: auto
          limit: 2000

      # Last of the four, because its caption is the one an operator has to read: a usage query can
      # only ever see accounts that DREW something.
      - id: family-accounts
        type: stat
        title: Accounts
        subtitle: Only accounts with usage in this window — an account that drew nothing never appears in a usage query at all.
        span: 1
        metric: derived:activeActors
        options:
          dimension: account_id
        query:
          scope: family
          group_by:
            - account_id
            - model
          bucket: auto
          limit: 2000

      # `dimension: none` — the family TOTAL, summed across every account and model in the merged
      # response, rather than one line per account (that is the board below). The dashed line is
      # the previous period, re-based forward so the two overlay instead of doubling the x-domain.
      - id: family-spend
        type: series
        title: Spend over time
        subtitle: Every account in your family, summed. The dashed line is the previous period.
        span: 2
        metric: cost
        compare: true
        options:
          dimension: none
          scale: linear
        query:
          scope: family
          group_by:
            - account_id
            - model
          bucket: auto
          limit: 2000

      - id: spend-by-account
        type: series
        title: Spend by account
        subtitle: One line per account, values on hover.
        span: 2
        metric: cost
        options:
          dimension: account_id
          scale: linear
          topN: 12
        query:
          scope: family
          group_by:
            - account_id
            - model
          bucket: auto
          limit: 2000

      - id: family-model-share
        type: share
        title: Spend by model
        subtitle: The share across every account in your family. Spend the backend attributed to no model is a labelled Unassigned segment, never dropped.
        span: 1
        metric: cost
        options:
          dimension: model
          topN: 5
        query:
          scope: family
          group_by:
            - account_id
            - model
          bucket: auto
          limit: 2000

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # /settings/overview/account — the account analytics lens (converse-frontends#455, story C12).
  #
  # One of the three "scope-parameterised" lenses `use-settings-overview-screen.ts` drove by hand
  # until 2026-09-02. Each is now its own YAML entry rather than one hook keyed by a `lens`
  # literal: what actually differed between them was the scope and one breakdown dimension, which
  # is precisely what a page entry states.
  #
  # Hand-written beside this grid, because neither is a usage query over the page's range: the
  # cumulative BUDGET BURN-DOWN (its ceiling is `getMyBudgetBalance`, its window the billing
  # period) and, for an admin, KEY HYGIENE (a refine listing of the account's API keys).
  #
  # Eight panels, TWO requests — the ungrouped one and one `[project_id, model]` grouping. The
  # hand-written lens fired four (day, model-day, model-totals, secondary).
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  - route: /settings/overview/account
    filters:
      - accountId

    panels:
      - id: requests
        type: stat
        title: Requests
        span: 1
        metric: requests
        query:
          scope: account
          scope_id: $accountId
          bucket: auto
          limit: 2000

      - id: cost
        type: stat
        title: Cost
        span: 1
        metric: cost
        compare: true
        query:
          scope: account
          scope_id: $accountId
          bucket: auto
          limit: 2000

      - id: cost-per-request
        type: stat
        title: Cost / request
        subtitle: Blank when the window carries no requests at all — a mean over nothing is not a number.
        span: 1
        metric: derived:costPerRequest
        query:
          scope: account
          scope_id: $accountId
          bucket: auto
          limit: 2000

      - id: models-in-use
        type: stat
        title: Models in use
        span: 1
        metric: derived:activeActors
        options:
          dimension: model
        query:
          scope: account
          scope_id: $accountId
          group_by:
            - project_id
            - model
          bucket: auto
          limit: 2000

      - id: spend-over-time
        type: series
        title: Spend over time
        subtitle: The account total across every project and model.
        span: 2
        metric: cost
        options:
          scale: linear
        query:
          scope: account
          scope_id: $accountId
          bucket: auto
          limit: 2000

      - id: spend-by-model
        type: ranked
        title: Spend by model
        span: 1
        metric: cost
        options:
          dimension: model
          topN: 6
        query:
          scope: account
          scope_id: $accountId
          group_by:
            - project_id
            - model
          bucket: auto
          limit: 2000

      - id: spend-by-project
        type: ranked
        title: Spend by project
        subtitle: Spend the backend attributed to no project is a labelled Unassigned row, never dropped.
        span: 1
        metric: cost
        options:
          dimension: project_id
          topN: 6
        query:
          scope: account
          scope_id: $accountId
          group_by:
            - project_id
            - model
          bucket: auto
          limit: 2000

      - id: latency-by-model
        type: latency-cards
        title: Latency by model
        subtitle: Percentiles are computed per bucket by the usage backend; each card states the WORST bucket in this window, never an average of percentiles. p99 is hidden below 100 samples.
        span: 2
        metric: latency
        options:
          dimension: model
        query:
          scope: account
          scope_id: $accountId
          group_by:
            - project_id
            - model
          bucket: auto
          limit: 2000

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # /settings/overview/project — the project analytics lens (converse-frontends#455, story C12).
  # Same shape as the account lens, with the secondary breakdown on API KEYS rather than projects
