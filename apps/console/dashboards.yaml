          scope_id: $projectId
          bucket: auto
          limit: 2000

      - id: cost-per-request
        type: stat
        title: settings-overview-project.cost-per-request.title
        subtitle: settings-overview-project.cost-per-request.subtitle
        span: 1
        metric: derived:costPerRequest
        query:
          scope: project
          scope_id: $projectId
          bucket: auto
          limit: 2000

      - id: models-in-use
        type: stat
        title: settings-overview-project.models-in-use.title
        span: 1
        metric: derived:activeActors
        options:
          dimension: model
        query:
          scope: project
          scope_id: $projectId
          group_by:
            - api_key_id
            - model
          bucket: auto
          limit: 2000

      - id: spend-over-time
        type: series
        title: settings-overview-project.spend-over-time.title
        subtitle: settings-overview-project.spend-over-time.subtitle
        span: 2
        metric: cost
        options:
          scale: linear
        query:
          scope: project
          scope_id: $projectId
