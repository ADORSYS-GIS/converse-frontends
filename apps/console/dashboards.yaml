      - id: spend-by-model
        type: ranked
        title: settings-overview-project.spend-by-model.title
        span: 1
        metric: cost
        options:
          dimension: model
          topN: 6
        query:
          scope: project
          scope_id: $projectId
          group_by:
            - api_key_id
            - model
          bucket: auto
          limit: 2000

      - id: spend-by-api-key
        type: ranked
        title: settings-overview-project.spend-by-api-key.title
        subtitle: settings-overview-project.spend-by-api-key.subtitle
        span: 1
        metric: cost
        options:
          dimension: api_key_id
          topN: 6
        query:
          scope: project
          scope_id: $projectId
          group_by:
            - api_key_id
            - model
          bucket: auto
          limit: 2000

      - id: latency-by-model
        type: latency-cards
        title: settings-overview-project.latency-by-model.title
        subtitle: settings-overview-project.latency-by-model.subtitle
        span: 2
        metric: latency
        options:
          dimension: model
        query:
          scope: project
          scope_id: $projectId
          group_by:
            - api_key_id
            - model
          bucket: auto
          limit: 2000

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # /settings/overview/user — "Your usage" (converse-frontends#455, story C12).
  #
  # `scope: user` is the one scope the usage backend allows ONLY for the caller's own token
  # subject — there is no admin bypass and no user picker, so `$sub` can never be anyone else's
  # id, and this lens carries no secondary breakdown: a single identity's usage has no natural
  # sub-dimension beyond the model. No hand-written zone at all.
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  - route: /settings/overview/user
    filters:
      - sub

    panels:
      - id: requests
        type: stat
        title: settings-overview-user.requests.title
        span: 1
        metric: requests
        query:
          scope: user
          scope_id: $sub
          bucket: auto
          limit: 2000

      - id: cost
        type: stat
        title: settings-overview-user.cost.title
        span: 1
        metric: cost
        compare: true
        query:
          scope: user
          scope_id: $sub
          bucket: auto
          limit: 2000

      - id: cost-per-request
        type: stat
        title: settings-overview-user.cost-per-request.title
        subtitle: settings-overview-user.cost-per-request.subtitle
        span: 1
        metric: derived:costPerRequest
        query:
          scope: user
          scope_id: $sub
          bucket: auto
          limit: 2000

      - id: models-in-use
        type: stat
        title: settings-overview-user.models-in-use.title
        span: 1
        metric: derived:activeActors
        options:
          dimension: model
        query:
          scope: user
          scope_id: $sub
          group_by:
            - model
          bucket: auto
          limit: 2000

      - id: spend-over-time
        type: series
        title: settings-overview-user.spend-over-time.title
        subtitle: settings-overview-user.spend-over-time.subtitle
        span: 2
        metric: cost
        options:
          scale: linear
        query:
          scope: user
          scope_id: $sub
          bucket: auto
          limit: 2000

      # Full width, like every other `latency-cards` panel in this file — owner directive,
      # 2026-09-03. See `/accounts/[accountId]/overview`'s own comment on the same panel.
      #
      # It moved AHEAD of `spend-by-model` in the same pass, and that is a layout fact rather than
      # a reading preference: `dashboard-grid` has no `dense` flow, so a half-width panel sitting
      # between two full-width ones leaves the other half of its row empty. This lens has exactly
      # one half-width breakdown (the user lens has no secondary dimension — see
      # `overview-pages.test.ts`), so the only placement that costs no hole is LAST.
      - id: latency-by-model
        type: latency-cards
        title: settings-overview-user.latency-by-model.title
        subtitle: settings-overview-user.latency-by-model.subtitle
        span: 2
        metric: latency
        options:
          dimension: model
        query:
          scope: user
          scope_id: $sub
          group_by:
            - model
          bucket: auto
          limit: 2000

      - id: spend-by-model
        type: ranked
        title: settings-overview-user.spend-by-model.title
        span: 1
        metric: cost
        options:
          dimension: model
          topN: 6
        query:
          scope: user
          scope_id: $sub
          group_by:
            - model
          bucket: auto
          limit: 2000
