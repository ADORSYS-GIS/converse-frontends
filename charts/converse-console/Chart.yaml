apiVersion: v2
name: converse-console
description: Lightbridge Console UI (Next.js, Node runtime) — apps/console's server-rendered app, not a static export (bjw-s app-template)
type: application

# A brand-new chart/package (ticket #287), not a version bump of charts/converse-frontend: that
# chart keeps serving apps/self-service (nginx, still live in production until Epic 4) completely
# unchanged, on its own existing floating-semver consumer in ai-helm-values
# (`targetRevision: ">=0.0.0"` against oci://ghcr.io/adorsys-gis/charts/converse-frontend). Editing
# that chart's shape in place — container port, probes, labels, config mechanism — would have been
# picked up by that consumer on the very next ArgoCD reconcile and taken self-service down; there
# is no version-bump discipline on this repo's side that fences off a range that broad. A separate
# chart directory publishes as a separate GHCR package
# (oci://ghcr.io/adorsys-gis/charts/converse-console — see publish-charts-oci.yml, which globs
# `charts/*/Chart.yaml`), so this is the only mechanism that removes the collision risk entirely
# rather than relying on a version range holding.
# MAJOR.MINOR only — `publish-charts-oci.yml` DERIVES the published patch at push time as
# `git rev-list --count HEAD -- charts/converse-console` and never writes it back here. So the
# number in this file is a FLOOR, and the registry currently holds 0.2.5.
#
# NOT bumped by the OpenTelemetry change (converse-frontends#443), deliberately, and this is the
# single most important line in this file to read before editing it: `ai-helm`'s `console-ui`
# Application pins `targetRevision: "~0.2.4"`, i.e. `>=0.2.4 <0.3.0`. A minor bump here publishes
# 0.3.0, which that range does NOT resolve — ArgoCD then keeps serving the last version it can
# resolve while a values file written for the new chart is already merged. That is exactly the
# incident this estate had on 2026-09-02. Adding a commit under `charts/` is enough: this change
# publishes 0.2.6, inside the range, and adds only new env keys with inert defaults, which is what
# makes staying inside a patch range honest rather than merely convenient.
#
# Bump the minor when the chart's SHAPE changes in a way a consumer must opt into — and widen the
# pin in ai-helm in the same change, before merging any values that depend on it.
version: 0.2.0

# Tracks the container image tag by default
appVersion: 0.2.0

keywords:
  - converse
  - console
  - frontend
  - ui
  - typescript

dependencies:
  - name: app-template
    version: 4.6.2
    repository: https://bjw-s-labs.github.io/helm-charts
    alias: console
