# helm lint / helm template fixture #1 of 2 (story ai-helm-values#346): today's shape — the
# typst-render sidecar OFF, no template mount, no dashboards override. Rendering this must produce
# a single-container Deployment identical to the pre-#346 output apart from the two new env vars
# on the console container (CONSOLE_TEMPLATES_DIR, TYPST_RENDER_URL), and no NetworkPolicy at all.
#
# The chart's own values.yaml ships `config.yaml: ''`, which values.schema.json requires to be
# non-empty — so `helm lint` against bare defaults fails BY DESIGN (see publish-charts-oci.yml).
# These fixtures exist so lint and template have a valid document to run against:
#
#   helm lint    charts/converse-console -f charts/converse-console/ci/renderer-disabled-values.yaml
#   helm template console-ui charts/converse-console \
#     -f charts/converse-console/ci/renderer-disabled-values.yaml
console:
  configMaps:
    console-config:
      data:
        config.yaml: |
          session:
            secret: '{env:SESSION_SECRET}'
          idp:
            issuer: https://idp.example.test/realms/lightbridge
            clientId: console
          backendUrl: https://authz-api.example.test
          budgetUrl: https://authz-budget.example.test
