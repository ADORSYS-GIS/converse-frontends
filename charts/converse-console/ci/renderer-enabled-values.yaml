# helm lint / helm template fixture #2 of 2 (story ai-helm-values#346): every switch this story
# adds, ON — the pinned typst-render sidecar, its emptyDir /tmp, the ingress NetworkPolicy, an
# overriding dashboards.yaml in the console-config ConfigMap, and a report-templates mount.
#
#   helm lint    charts/converse-console -f charts/converse-console/ci/renderer-enabled-values.yaml
#   helm template console-ui charts/converse-console \
#     -f charts/converse-console/ci/renderer-enabled-values.yaml
#
# Note the pairings this file exercises on purpose, because each is a way to break a healthy pod:
#   * containers.typst-render.enabled  ⇄  persistence.typst-tmp.enabled
#     (readOnlyRootFilesystem with no writable /tmp = every render fails at mkdtemp)
#   * persistence.console-dashboards.enabled  ⇄  configMaps.console-config.data['dashboards.yaml']
#     (a subPath naming an absent ConfigMap key does not fall back — the kubelet refuses to mount)
#   * persistence.report-templates.enabled  ⇄  configMaps.report-templates.enabled
#   * persistence.report-template-assets.enabled  ⇄  configMaps.report-template-assets.enabled
#
# The template mounts here are the REAL prod shape (owner feedback 2026-09-03, "custom templates
# WITH embedded logos"): one route bundle — `admin/overview/report.typ` plus its own `logo.png` —
# assembled from TWO ConfigMaps into one directory tree by per-file `path` + `subPath` mounts,
# because app-template forbids one ConfigMap from carrying both `data` and `binaryData` and a
# ConfigMap key cannot contain `/`.
console:
  controllers:
    main:
      containers:
        typst-render:
          enabled: true
  persistence:
    typst-tmp:
      enabled: true
    console-dashboards:
      enabled: true
    report-templates:
      enabled: true
      # Per-FILE, not the default directory mount: a directory mount would occupy
      # /config/console/templates and leave no mount point for the binary assets below.
      advancedMounts:
        main:
          frontend:
            - path: /config/console/templates/admin/overview/report.typ
              subPath: admin-overview-report.typ
              readOnly: true
    report-template-assets:
      enabled: true
      advancedMounts:
        main:
          frontend:
            - path: /config/console/templates/admin/overview/logo.png
              subPath: admin-overview-logo.png
              readOnly: true
  networkpolicies:
    typst-render-isolation:
      enabled: true
  configMaps:
    console-config:
      data:
        config.yaml: |
          session:
            secret: '{env:SESSION_SECRET}'
          idp:
            issuer: https://idp.example.test/realms/lightbridge
            clientId: console
          backendUrl: https://authz-api.example.test
          budgetUrl: https://authz-budget.example.test
        dashboards.yaml: |
          dashboards: []
    report-templates:
      enabled: true
      data:
        # Key names are flat and arbitrary — the MOUNT decides where each one lands in the route
        # tree. `image("logo.png")` with no leading slash: a per-route template compiles as
        # `main.typ` at the render root, so its siblings are relative to it.
        admin-overview-report.typ: |
          #import "_lib/report.typ": *
          #let report = json(sys.inputs.at("data"))
          #show: report-page.with(report)
          #align(right, image("logo.png", height: 20pt))
          #panels-in-order(report)
    report-template-assets:
      enabled: true
      binaryData:
        # A 1×1 PNG — this fixture exists to prove the MOUNT renders, not to be looked at.
        admin-overview-logo.png: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8Xw8AAoMBgDTD2qgAAAAASUVORK5CYII=
