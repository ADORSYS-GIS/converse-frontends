global:
  labels:
    app: converse-frontend
    team: ""

conversefrontend:
  controllers:
    main:
      type: deployment
      strategy: RollingUpdate
      replicas: 2
      pod:
        labels:
          app: converse-frontend-app
      containers:
        frontend:
          image:
            repository: ghcr.io/adorsys-gis/converse-frontends
            tag: sha-9d48
            pullPolicy: IfNotPresent

         
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            EXPO_PUBLIC_BACKEND_URL: ""
            # authz-budget: the microservice the 14 budget:*-gated RPC procedures moved onto
            # (hard cutover, lightbridge-authz PR #351 — authz-api no longer serves them). Leave
            # unset to fall back to EXPO_PUBLIC_BACKEND_URL (budget calls will 404 until this is
            # set to a real authz-budget ingress — none is enabled in any environment yet).
            EXPO_PUBLIC_BUDGET_URL: ""
            EXPO_PUBLIC_USAGE_URL: ""
            EXPO_PUBLIC_GATEWAY_URL: ""
            EXPO_PUBLIC_ANALYTICS_URL: ""

            EXPO_PUBLIC_KEYCLOAK_ISSUER: ""
            EXPO_PUBLIC_KEYCLOAK_CLIENT_ID: ""
            EXPO_PUBLIC_KEYCLOAK_SCHEME: "https"
            # JWT Audience validation - ensures tokens are intended for this API
            # Set to "true" to enable audience validation
            EXPO_PUBLIC_KEYCLOAK_AUDIENCE_REQUIRED: "false"
            # Comma-separated list of expected audience values (e.g., "converse-frontend" or "converse-frontend,api-key")
            EXPO_PUBLIC_KEYCLOAK_EXPECTED_AUDIENCE: ""

            # Grafana usage dashboard embed (Usage tab). Optional — leave unset to hide the tab.
            EXPO_PUBLIC_GRAFANA_URL: ""
            EXPO_PUBLIC_GRAFANA_USAGE_DASHBOARD_PATH: ""

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

          probes:
            liveness:
              enabled: true
              type: HTTP
              path: /
              spec:
                httpGet:
                  port: http
            readiness:
              enabled: true
              type: HTTP
              path: /
              spec:
                httpGet:
                  port: http
            startup:
              enabled: true
              type: HTTP
              path: /
              spec:
                httpGet:
                  port: http
                failureThreshold: 30
                periodSeconds: 5

  service:
    frontend:
      enabled: true
      annotations: {}
      type: ClusterIP
      controller: main
      ports:
        http:
          enabled: true
          port: 80
          targetPort: http