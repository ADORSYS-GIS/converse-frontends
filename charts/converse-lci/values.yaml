global:
  labels:
    app: lci
    team: ''

lci:
  controllers:
    main:
      type: deployment
      strategy: RollingUpdate
      replicas: 2
      pod:
        labels:
          app: lci-app
      containers:
        frontend:
          image:
            repository: ghcr.io/adorsys-gis/converse-frontends/lci
            # argocd-image-updater re-pins this to a real `sha-<gitsha>` tag once the workflow has
            # pushed at least one image; `latest` here is only a bootstrap default.
            tag: latest
            pullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          # apps/lci reads its configuration from plain environment variables (lib/auth/*,
          # lib/server/admin.ts, lib/server/api.ts) — there is no config-document mechanism this
          # chart mounts on the app's behalf. This map is deliberately EMPTY here: every key below
          # is a real per-deployment literal (a real Keycloak/authz-idp issuer, a real
          # control-plane URL, ...), so a real deployment supplies its own complete env map via
          # its own values file (see README.md) rather than this chart shipping placeholder
          # values that could silently pass validation.
          #
          # values.schema.json requires the keys a deployment cannot omit (OIDC_ISSUER,
          # OIDC_CLIENT_ID, CONTROL_PLANE_URL, and one of OIDC_REDIRECT_URI/
          # OIDC_POST_LOGOUT_REDIRECT_URI) to be present with a non-empty value — Helm validates
          # this during lint/install/upgrade, so a deployment with none of its own env supplied
          # fails fast instead of booting with the app code's own `http://localhost:*` fallbacks
          # (see apps/lci/src/lib/auth/oidc-config.ts, apps/lci/src/lib/server/admin.ts).
          #
          # README.md documents every key this app reads, which are required vs. optional, and —
          # importantly — that NEXT_PUBLIC_GRAFANA_URL has NO EFFECT set here: Next.js inlines
          # NEXT_PUBLIC_* variables at `next build` time, not at container start.
          #
          # The three OpenTelemetry keys below are the ONE exception to "this map is empty", and
          # they do not violate the reasoning above: none of them is a placeholder that could pass
          # validation while being wrong. Two carry a real, universally-correct value, and the
          # blank one is blank because blank IS the meaningful default — it means "do not export",
          # which is exactly right for a deployment that has no collector.
          env:
            # ── OpenTelemetry (converse-frontends#443) ────────────────────────────────────────
            # LCI starts a Node OTel SDK from `src/instrumentation.ts` and exports OTLP over HTTP.
            # Setting an endpoint is the ONLY thing that turns it on: with this blank the app logs
            # one line saying so and starts no SDK at all. There is deliberately no second
            # `otel.enabled`-style toggle — a flag that can disagree with the endpoint is a way to
            # ship the feature switched off, and the app treats "" and unset identically
            # (`packages/otel/src/config.ts`, covered by its own test).
            #
            # A deployment fills this in from its own values file. In this estate that is
            # `http://alloy.observability.svc.cluster.local:4318` — Grafana Alloy's OTLP receiver,
            # the same one lightbridge-code-intelligence's own backends already push to, which
            # forwards to Tempo. Alloy's CiliumNetworkPolicy admits `fromEntities: cluster` on
            # 4317/4318 and the `converse` namespace has no egress default-deny, so no policy work
            # is needed on either side.
            OTEL_EXPORTER_OTLP_ENDPOINT: ''

            # OTLP/HTTP with protobuf bodies — the OTLP spec default, and the only wire format
            # `@lightbridge/otel` implements. It is VALIDATED, not merely read: `grpc` (:4317) or
            # `http/json` here makes the app refuse to start the SDK and say why, rather than send
            # a format the operator did not ask for.
            OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf

            # `deployment.environment.name` on every span. Blank because this chart genuinely does
            # not know — only the deployment does. Omitted from the resource entirely when unset,
            # rather than reported as "unknown".
            DEPLOYMENT_ENVIRONMENT: ''

            # NOT set here, on purpose: `OTEL_SERVICE_NAME` (`converse-lci` is compiled into the
            # image — repeating it here is a second place for the name to be wrong) and
            # `OTEL_TRACES_SAMPLER_ARG` (defaults to 1.0 in the app). Both are read when a
            # deployment sets them; neither is defaulted twice. See README.md.

          resources:
            # A Node SSR server, not nginx serving static files — every request runs application
            # code (session/JWT verification, OIDC token exchange, control-plane proxying), so
            # both floors sit meaningfully above a static-file pod's.
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 512Mi

          probes:
            # /robots.txt (app/robots.ts): a static Next.js metadata route, excluded from
            # proxy.ts's session-gate matcher and independent of runtime config — a clean "is the
            # Node server actually serving requests" signal. `/` itself always redirects to
            # /api/auth/login when unauthenticated, and a kubelet probe can't follow that redirect
            # meaningfully.
            liveness:
              enabled: true
              type: HTTP
              path: /robots.txt
              spec:
                httpGet:
                  port: http
            readiness:
              enabled: true
              type: HTTP
              path: /robots.txt
              spec:
                httpGet:
                  port: http
            startup:
              enabled: true
              type: HTTP
              path: /robots.txt
              spec:
                httpGet:
                  port: http
                failureThreshold: 30
                periodSeconds: 5

  service:
    frontend:
      enabled: true
      annotations: {}
      type: ClusterIP
      controller: main
      ports:
        http:
          enabled: true
          port: 80
          targetPort: http

  # Runtime white-label logo — disabled by default, so the app renders its own built-in mark.
  # Two ConfigMaps, not one: an entry can't carry both `data` and `binaryData`. Both mount into
  # /tmp/branding/. Enabling logo-light without logo renders no mark at all under `black`, this
  # app's default theme.
  persistence:
    branding-logo:
      enabled: false
      type: configMap
      identifier: branding-logo
      globalMounts:
        - path: /tmp/branding/logo.png
          subPath: logo.png
          readOnly: true
    branding-logo-light:
      enabled: false
      type: configMap
      identifier: branding-logo-light
      globalMounts:
        - path: /tmp/branding/logo-light.png
          subPath: logo-light.png
          readOnly: true

  configMaps:
    branding-logo:
      enabled: false
      binaryData:
        logo.png: ''
    branding-logo-light:
      enabled: false
      binaryData:
        logo-light.png: ''

  # Deliberately disabled with no host: this app's public hostname is decided and owned by the
  # private ai-helm-values repo (this chart does not set it — see that repo's converse-lci values
  # / Application for the real value), not this chart. Set `enabled: true` and populate `hosts`
  # there; this stanza only exists so an operator has somewhere obvious to do that instead of
  # inventing a new key.
  ingress:
    frontend:
      enabled: false
      className: ''
      hosts: []
