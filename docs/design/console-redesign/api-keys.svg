<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Lightbridge console — Api-Keys screen mockup, dark theme">
<title>Lightbridge console — Api-Keys</title>
<style>
  .m   { font-family: ui-monospace, "IBM Plex Mono", "SFMono-Regular", Menlo, monospace; }
