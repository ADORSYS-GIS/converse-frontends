<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img" aria-label="Lightbridge console — compact tier (600–1024): right panel docks as a bottom sheet">
<title>Lightbridge console — compact tier shell (600–1024)</title>
<style>
  .m   { font-family: ui-monospace, "IBM Plex Mono", "SFMono-Regular", Menlo, monospace; }
  .s   { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
