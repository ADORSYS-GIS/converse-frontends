<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="LCI app — Code graph screen mockup, showing the label-overflow fix from lightbridge-code-intelligence issue 635">
<title>LCI app — Code graph (with the #635 node-sizing fix drawn in)</title>
<style>
  .m   { font-family: ui-monospace, "IBM Plex Mono", "SFMono-Regular", Menlo, monospace; }
  .lab { font-size: 10px; letter-spacing: .09em; fill: #606060; }
  .hi  { fill: #eeeeee; }
  .bo  { fill: #b4b4b4; }
  .mu  { fill: #606060; }
  .ac  { fill: #DA5C2C; }
  .rule{ stroke: #202020; stroke-width: 1; }
  .node{ fill: #191919; stroke: #3a3a3a; stroke-width: 1; rx: 2; }
  .edge{ stroke: #3a3a3a; stroke-width: 1; fill: none; }
</style>

<rect width="1440" height="900" fill="#000000"/>

<rect x="0" y="0" width="1440" height="56" fill="#111111"/>
<text class="m hi" x="20" y="32" font-size="12" letter-spacing=".14em">LCI</text>
<text class="m mu" x="1362" y="32" font-size="11" text-anchor="end">sam@adorsys.com</text>
<circle cx="1398" cy="28" r="13" fill="#202020"/>
<text class="m bo" x="1398" y="32" font-size="10" text-anchor="middle">SL</text>

<rect x="0" y="56" width="208" height="844" fill="#191919"/>
<text class="m lab" x="16" y="88">LCI</text>
<text class="m bo" x="44" y="125" font-size="12">Repositories</text>
<text class="m mu" x="44" y="163" font-size="12">Overview</text>
<text class="m mu" x="44" y="197" font-size="12">Runs</text>
<text class="m mu" x="44" y="231" font-size="12">Admin</text>
<text class="m mu" x="44" y="265" font-size="12">Settings</text>

<text class="m mu" x="248" y="88" font-size="11">Repositories / lightbridge-code-intelligence /</text>
<line x1="248" y1="112" x2="1120" y2="112" class="rule"/>
<text class="m bo" x="248" y="134" font-size="12">Overview</text>
<text class="m hi" x="316" y="134" font-size="12">Graph</text>
<rect x="316" y="142" width="42" height="2" fill="#DA5C2C"/>
<text class="m bo" x="368" y="134" font-size="12">Settings</text>

<!-- centre: node-link canvas on the floor -->
<text class="m lab" x="248" y="168">CODE GRAPH — src/middleware/request_logger.rs:61 neighbourhood</text>
<rect x="248" y="180" width="872" height="640" rx="2" fill="#050505" stroke="#191919"/>

<!-- edges drawn first so nodes sit on top; both ends visibly anchored -->
<path class="edge" d="M 420 260 L 420 340"/>
<path class="edge" d="M 420 400 L 640 400"/>
<path class="edge" d="M 420 400 L 420 500"/>
<path class="edge" d="M 640 460 L 640 560"/>

<!-- a normal, short-label node: fixed-ish box is fine when the label is short -->
<rect x="352" y="220" width="136" height="40" rx="2" class="node"/>
<text class="m hi" x="420" y="244" font-size="10" text-anchor="middle">handle_request</text>

<!-- the long-label node, drawn twice: the OLD fixed-200×44 behaviour (dashed, struck through, -->
<!-- the #635 bug) ghosted behind the NEW measured-to-label box this screen actually specifies -->
<rect x="320" y="340" width="200" height="44" rx="2" fill="none" stroke="#3a3a3a" stroke-width="1" stroke-dasharray="3,3" opacity="0.55"/>
<text class="mu" x="420" y="366" font-size="9" text-anchor="middle" opacity="0.55" text-decoration="line-through">middleware::request_logger::&lt;impl RequestLogger&gt;::log_and_forward(…)</text>
<text class="ac m" x="420" y="398" font-size="8" text-anchor="middle" opacity="0.8">↑ old: fixed 200×44 box (#635) — label overflows</text>

<rect x="256" y="410" width="328" height="52" rx="2" class="node" stroke="#DA5C2C"/>
<text class="m hi" x="420" y="432" font-size="9" text-anchor="middle">middleware::request_logger::</text>
<text class="m hi" x="420" y="446" font-size="9" text-anchor="middle">&lt;impl RequestLogger&gt;::log_and_forward(&amp;self, req)</text>
<text class="m ac" x="420" y="475" font-size="8" text-anchor="middle">↑ new: box measured to the rendered label — nothing overflows, no floating edge</text>

<rect x="552" y="380" width="176" height="40" rx="2" class="node"/>
<text class="m hi" x="640" y="404" font-size="10" text-anchor="middle">ControlPlaneClient</text>

<rect x="552" y="540" width="176" height="40" rx="2" class="node"/>
<text class="m hi" x="640" y="564" font-size="10" text-anchor="middle">emit_span</text>

<rect x="336" y="480" width="168" height="40" rx="2" class="node"/>
<text class="m hi" x="420" y="504" font-size="10" text-anchor="middle">RequestContext</text>

<!-- right rail: node inspector, persistent -->
<rect x="1144" y="56" width="280" height="844" fill="#191919"/>
<text class="m lab" x="1160" y="88">NODE INSPECTOR</text>
<line x1="1160" y1="100" x2="1408" y2="100" class="rule"/>
<text class="m hi" x="1160" y="126" font-size="12">log_and_forward</text>
<text class="m bo" x="1160" y="148" font-size="10">src/middleware/request_logger.rs:61</text>
<text class="m lab" x="1160" y="184">CALLERS (2)</text>
<text class="m bo" x="1160" y="204" font-size="11">handle_request</text>
<text class="m lab" x="1160" y="236">CALLS (2)</text>
<text class="m bo" x="1160" y="256" font-size="11">ControlPlaneClient</text>
<text class="m bo" x="1160" y="276" font-size="11">emit_span</text>
</svg>
