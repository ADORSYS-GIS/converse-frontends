<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="LCI app — Repositories list and detail screen mockup, dark theme">
<title>LCI app — Repositories (list + detail shell)</title>
<style>
  .m   { font-family: ui-monospace, "IBM Plex Mono", "SFMono-Regular", Menlo, monospace; }
  .s   { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
  .lab { font-size: 10px; letter-spacing: .09em; fill: #606060; }
  .hi  { fill: #eeeeee; }
  .bo  { fill: #b4b4b4; }
  .mu  { fill: #606060; }
  .ac  { fill: #DA5C2C; }
  .rule{ stroke: #202020; stroke-width: 1; }
  .ctl { fill: #111111; stroke: #3a3a3a; stroke-width: 1; }
</style>

<rect width="1440" height="900" fill="#000000"/>

<!-- header -->
<rect x="0" y="0" width="1440" height="56" fill="#111111"/>
<text class="m hi" x="20" y="32" font-size="12" letter-spacing=".14em">LCI</text>
<line x1="80" y1="16" x2="80" y2="40" stroke="#3a3a3a"/>
<text class="m bo" x="96" y="32" font-size="12">adorsys-gis</text>
<text class="m mu" x="1362" y="32" font-size="11" text-anchor="end">sam@adorsys.com</text>
<circle cx="1398" cy="28" r="13" fill="#202020"/>
<text class="m bo" x="1398" y="32" font-size="10" text-anchor="middle">SL</text>

<!-- left rail: nav-spine, flush full-height -->
<rect x="0" y="56" width="208" height="844" fill="#191919"/>
<text class="m lab" x="16" y="88">LCI</text>
<rect x="0" y="104" width="208" height="34" fill="#202020"/>
<rect x="0" y="104" width="2" height="34" fill="#DA5C2C"/>
<text class="m hi" x="44" y="125" font-size="12">Repositories</text>
<text class="m bo" x="44" y="163" font-size="12">Overview</text>
<text class="m bo" x="44" y="197" font-size="12">Runs</text>
<line x1="16" y1="220" x2="192" y2="220" class="rule"/>
<text class="m mu" x="44" y="243" font-size="12">Admin</text>
<text class="m mu" x="192" y="243" font-size="9" text-anchor="end" letter-spacing=".08em">ROLE</text>
<text class="m mu" x="44" y="277" font-size="12">Settings</text>

<!-- inset: the /dashboard/repositories list, shown small since the detail shell below is the -->
<!-- novel part; the list itself is the same ledger-table + preset-picker shape as runs.svg -->
<text class="m lab" x="248" y="88">/DASHBOARD/REPOSITORIES — LIST (INSET)</text>
<rect x="248" y="100" width="600" height="140" rx="2" fill="#111111" stroke="#202020"/>
<rect x="264" y="112" width="130" height="20" rx="2" fill="#191919" stroke="#3a3a3a"/>
<text class="m mu" x="272" y="126" font-size="9">All presets ▾</text>
<line x1="264" y1="146" x2="836" y2="146" class="rule"/>
<text class="m lab" x="272" y="160">NAME</text>
<text class="m lab" x="560" y="160">LAST INDEXED</text>
<text class="m lab" x="700" y="160">STATUS</text>
<g class="m" font-size="11">
  <text class="hi" x="272" y="182">converse-frontends</text>
  <text class="bo" x="560" y="182">3m ago</text>
  <text class="bo" x="700" y="182">Indexed</text>
  <text class="hi" x="272" y="204">lightbridge-code-intelligence</text>
  <text class="bo" x="560" y="204">1h ago</text>
  <text class="ac" x="700" y="204">Indexing</text>
</g>
<line x1="264" y1="216" x2="836" y2="216" class="rule"/>
<text class="m mu" x="272" y="232" font-size="9">1–2 / 2</text>

<!-- centre: repo detail shell — floor content, NO card wrapper (see PRIMITIVES.md) -->
<text class="m lab" x="248" y="272">/DASHBOARD/REPOSITORIES/[ID] — DETAIL SHELL</text>
<text class="m mu" x="248" y="300" font-size="11">Repositories /</text>
<text class="m hi" x="340" y="300" font-size="16">lightbridge-code-intelligence</text>

<!-- sub-nav: Base UI Tabs, counts never a badge -->
<line x1="248" y1="324" x2="1120" y2="324" class="rule"/>
<text class="m hi" x="248" y="346" font-size="12">Overview</text>
<rect x="248" y="354" width="66" height="2" fill="#DA5C2C"/>
<text class="m bo" x="332" y="346" font-size="12">Graph</text>
<text class="m bo" x="392" y="346" font-size="12">Settings</text>

<!-- overview tab: stat-card row directly on the floor, no border -->
<g>
  <rect x="248" y="380" width="204" height="88" rx="2" fill="#191919"/>
  <text class="m lab" x="264" y="404">FILES INDEXED</text>
  <text class="m hi" x="264" y="440" font-size="24">4 812</text>
  <rect x="464" y="380" width="204" height="88" rx="2" fill="#191919"/>
  <text class="m lab" x="480" y="404">LAST RUN</text>
  <text class="m hi" x="480" y="440" font-size="24">3m ago</text>
  <rect x="680" y="380" width="204" height="88" rx="2" fill="#191919"/>
  <text class="m lab" x="696" y="404">OPEN FINDINGS</text>
  <text class="m hi" x="696" y="440" font-size="24">7</text>
  <rect x="896" y="380" width="224" height="88" rx="2" fill="#191919"/>
  <text class="m lab" x="912" y="404">SOURCE</text>
  <text class="m bo" x="912" y="440" font-size="14">Admin override</text>
</g>

<text class="m lab" x="248" y="512">RECENT RUNS</text>
<rect x="248" y="524" width="872" height="180" rx="2" fill="#191919"/>
<line x1="264" y1="556" x2="1104" y2="556" class="rule"/>
<text class="m lab" x="272" y="546">RUN</text>
<text class="m lab" x="700" y="546">TRIGGERED</text>
<text class="m lab" x="900" y="546">STATUS</text>
<g class="m" font-size="11">
  <text class="hi" x="272" y="578">PR #612 — path-scoped webhook routes</text>
  <text class="bo" x="700" y="578">2026-08-28</text>
  <text class="bo" x="900" y="578">Complete</text>
</g>

<!-- right rail: contextual actions, persistent, never an overlay -->
<rect x="1144" y="56" width="280" height="844" fill="#191919"/>
<text class="m lab" x="1160" y="88">ACTIONS</text>
<rect x="1160" y="100" width="248" height="30" rx="2" class="ctl"/>
<text class="m hi" x="1284" y="120" font-size="12" text-anchor="middle">Reindex now</text>
<line x1="1160" y1="148" x2="1408" y2="148" class="rule"/>
<text class="m lab" x="1160" y="170">CONFIG SOURCE</text>
<text class="m bo" x="1160" y="192" font-size="11">Admin override — set 2026-08-20</text>
</svg>
