openapi: 3.1.0
info:
  title: lightbridge-authz-usage-rest
  description: ''
  contact:
    name: Stephane Segning
    email: selastlambou@gmail.com
  license:
    name: MIT
    identifier: MIT
  version: 0.8.1
paths:
  /usage/v1/usage/query:
    post:
      tags:
        - usage
      operationId: query_usage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsageQueryRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageQueryResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageErrorResponse'
  /v1/otel/logs:
    post:
      tags:
        - ingest
      operationId: ingest_logs
      requestBody:
        content:
          application/x-protobuf:
            schema:
              type: string
        required: true
      responses:
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '400':
          description: ''
  /v1/otel/metrics:
    post:
      tags:
        - ingest
      operationId: ingest_metrics
      requestBody:
        content:
          application/x-protobuf:
            schema:
              type: string
        required: true
      responses:
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '400':
          description: ''
  /v1/otel/traces:
    post:
      tags:
        - ingest
      operationId: ingest_traces
      requestBody:
        content:
          application/x-protobuf:
            schema:
              type: string
        required: true
      responses:
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '400':
          description: ''
components:
  schemas:
    IngestResponse:
      type: object
      required:
        - accepted_events
      properties:
        accepted_events:
          type: integer
          minimum: 0
    UsageErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    UsageGroupBy:
      description: >-
        The dimensions a usage query may group by. `azp`, `operation` and `billing_plan` are the
        bridge columns lightbridge-authz#648 added to `usage_events` (PR #652) — the OAuth client
        a request arrived on, which API surface was called, and the plan Authorino stamped on it.
        Order mirrors the backend enum exactly.
      type: string
      enum:
        - account_id
        - project_id
        - api_key_id
        - user_id
        - user_name
        - model
        - metric_name
        - signal_type
        - azp
        - operation
        - billing_plan
    UsageOperation:
      description: >-
        The closed `usage_events.operation` vocabulary (lightbridge-authz#648, `USAGE_OPERATIONS`).
        `other` is a real, storable value — the request carried a path and it was not one of the
        four known surfaces — and is NOT the same as `null`, which means the signal carried no path
        key at all. `null` is therefore deliberately absent: it is the absence of a value, not a
        filterable one.
      type: string
      enum:
        - chat_completions
        - responses
        - messages
        - embeddings
        - other
    UsageQueryFilters:
      type: object
      properties:
        account_id:
          type:
            - string
            - 'null'
        api_key_id:
          type:
            - string
            - 'null'
        azp:
          description: Equality filter on `usage_events.azp` — the OAuth client the request arrived on.
          type:
            - string
            - 'null'
        billing_plan:
          description: Equality filter on `usage_events.billing_plan`.
          type:
            - string
            - 'null'
        metric_name:
          type:
            - string
            - 'null'
        model:
          type:
            - string
            - 'null'
        operation:
          description: >-
            Equality filter on `usage_events.operation`. For "any of several operations" use
            `operation_in` rather than issuing one query per value.
          oneOf:
            - $ref: '#/components/schemas/UsageOperation'
            - type: 'null'
        operation_in:
          description: >-
            Set-membership filter on `usage_events.operation` (`AND operation = ANY($1)`, one bound
            `text[]`). Exists because the console's chat view is inherently a three-value question
            (`chat_completions`, `responses`, `messages`) and three separate queries would triple
            the load AND silently disagree with themselves whenever a bucket boundary or the
            `truncated` limit fell differently between them. An UNKNOWN value is a 400, never a
            quietly empty result set; an EMPTY list is refused too (`= ANY('{}')` is false for every
            row, so it could only ever lie about the estate having no usage). Combines with
            `operation` by AND, like every other filter pair here.
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/UsageOperation'
          minItems: 1
        project_id:
          type:
            - string
            - 'null'
        signal_type:
          type:
            - string
            - 'null'
        user_id:
          type:
            - string
            - 'null'
        user_name:
          type:
            - string
            - 'null'
    UsageQueryRequest:
      type: object
      required:
        - scope
        - scope_id
        - start_time
        - end_time
      properties:
        bucket:
          type: string
        end_time:
          type: string
          format: date-time
        filters:
          $ref: '#/components/schemas/UsageQueryFilters'
        group_by:
          type: array
          items:
            $ref: '#/components/schemas/UsageGroupBy'
        limit:
          type: integer
          format: int32
          minimum: 0
        scope:
          $ref: '#/components/schemas/UsageScope'
        scope_id:
          type: string
          description: >-
            The ID value for `scope`. Required as a wire field for every scope, but IGNORED for
            `scope: all` (an estate-wide query has no single id it is "about") — callers send
            `""`. For `scope: user`, must equal the caller's own validated token subject
            (self-ownership) or the request is refused.
        start_time:
          type: string
          format: date-time
    UsageQueryResponse:
      type: object
      required:
        - points
        - truncated
      properties:
        points:
          type: array
          items:
            $ref: '#/components/schemas/UsageSeriesPoint'
        truncated:
          type: boolean
          description: >-
            lightbridge-authz#578: `true` when more than `limit` DISTINCT `bucket_start` values
            matched the query and the OLDEST one was dropped WHOLE to fit. `limit` bounds the
            BUCKET count, not `points.len()` — with a non-empty `group_by`, `points` can hold more
            entries than `limit` (one per series per surviving bucket), and every surviving bucket
            keeps its FULL series set rather than an arbitrary subset. `false` means every matching
            bucket is present. The console surfaces this as an explicit per-panel truncation
            caption naming the limit (ADR 0013 D5) — never as a silently short chart.
    UsageScope:
      type: string
      description: >-
        Primary scoping dimension for a usage query, and its own authorization rule
        (lightbridge-authz#605, composing on #603; widened by #648/PR#652). `account`/`project`
        require the bearer token's subject to own the account, or own/roster-member the project
        (`authz-opa`'s `authorize_usage_scope`). `user` is allowed when `scope_id` equals the
        caller's own validated token subject (self-ownership, checked from the token directly, no
        remote call). `api_key` has no resolvable ownership authority at all and is refused
        unconditionally, for every caller. `all` is estate-wide — no `account_id`/`project_id`/
        `user_id`/`api_key_id` filter is added at all — and requires the bearer token to hold the
        `usage:read-all` permission (granted to `lightbridge-admin` by default,
        `oauth2.rbac.role_permissions` elsewhere); `scope_id` is ignored for this scope and
        should be sent as `""`.


        A token holding `usage:read-all` may additionally read ANY `scope_id` under
        `user`/`project`/`account`: without that widening those three scopes would be strictly
        NARROWER than `all` already is wide — the same permission already returns every row in the
        estate through `scope: all`, so refusing a single actor's slice of it protects nothing and
        only forces the console to fetch the estate and filter client-side. `api_key` is untouched
        by this: no amount of permission conjures an ownership authority that has never existed.
      enum:
        - user
        - api_key
        - project
        - account
        - all
    UsageSeriesPoint:
      type: object
      required:
        - bucket_start
        - requests
        - usage_value
        - total_cost
        - prompt_tokens
        - completion_tokens
        - total_tokens
        - latency_samples
      properties:
        account_id:
          type:
            - string
            - 'null'
        api_key_id:
          type:
            - string
            - 'null'
        azp:
          description: >-
            The OAuth client the requests in this bucket arrived on. Present when `group_by`
            includes `azp`, null otherwise — exactly like every other dimension echo here.
          type:
            - string
            - 'null'
        billing_plan:
          description: >-
            The billing plan stamped on the requests in this bucket. Present when `group_by`
            includes `billing_plan`, null otherwise.
          type:
            - string
            - 'null'
        bucket_start:
          type: string
          format: date-time
        completion_tokens:
          type: integer
          format: int64
        latency_samples:
          type: integer
          format: int64
          description: >-
            How many events in this bucket actually carried a latency measurement. A percentile
            over a handful of samples is noise and p99 needs ~100 samples before it means
            anything, so this count is returned alongside the percentiles. 0 means no event in
            this bucket reported latency at all — a legitimate per-series outcome, not an error:
            aggregate metric signals (OTLP histogram / exponential-histogram / summary data
            points) carry a bucketed distribution rather than one observation, so the backend
            deliberately records no latency for them rather than synthesising a mean.
        latency_p50_ms:
          type:
            - number
            - 'null'
          format: double
          description: >-
            Median request latency in milliseconds. Null exactly when latency_samples is 0 —
            never collapsed to 0, because "no latency was reported" and "every request took 0 ms"
            are different facts.
        latency_p95_ms:
          type:
            - number
            - 'null'
          format: double
          description: 95th-percentile request latency in milliseconds. Null when latency_samples is 0.
        latency_p99_ms:
          type:
            - number
            - 'null'
          format: double
          description: >-
            99th-percentile request latency in milliseconds. Null when latency_samples is 0, and
            meaningful only once latency_samples is large (~100+); below that it degenerates
            toward the bucket maximum.
        metric_name:
          type:
            - string
            - 'null'
        model:
          type:
            - string
            - 'null'
        operation:
          description: >-
            Which API surface was called, from the closed `UsageOperation` vocabulary. Present when
            `group_by` includes `operation`, null otherwise. A null here WHEN `operation` is grouped
            is a real value: those rows carried no request path at all.
          oneOf:
            - $ref: '#/components/schemas/UsageOperation'
            - type: 'null'
        project_id:
          type:
            - string
            - 'null'
        prompt_tokens:
          type: integer
          format: int64
        requests:
          type: integer
          format: int64
        signal_type:
          type:
            - string
            - 'null'
        total_cost:
          type: number
          format: double
        total_tokens:
          type: integer
          format: int64
        usage_value:
          type: number
          format: double
        user_id:
          type:
            - string
            - 'null'
        user_name:
          type:
            - string
            - 'null'
tags:
  - name: ingest
    description: OTEL ingest endpoints
  - name: usage
    description: Timeseries usage query endpoint
