openapi: 3.1.0
info:
  title: lightbridge-authz-usage-rest
  description: ''
  contact:
    name: Stephane Segning
    email: selastlambou@gmail.com
  license:
    name: MIT
    identifier: MIT
  version: 0.8.1
paths:
  /usage/v1/usage/query:
    post:
      tags:
        - usage
      operationId: query_usage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsageQueryRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageQueryResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageErrorResponse'
  /v1/otel/logs:
    post:
      tags:
        - ingest
      operationId: ingest_logs
      requestBody:
        content:
          application/x-protobuf:
            schema:
              type: string
        required: true
      responses:
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '400':
          description: ''
  /v1/otel/metrics:
    post:
      tags:
        - ingest
      operationId: ingest_metrics
      requestBody:
        content:
          application/x-protobuf:
            schema:
              type: string
        required: true
      responses:
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '400':
          description: ''
  /v1/otel/traces:
    post:
      tags:
        - ingest
      operationId: ingest_traces
      requestBody:
        content:
          application/x-protobuf:
            schema:
              type: string
        required: true
      responses:
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '400':
          description: ''
components:
  schemas:
    IngestResponse:
      type: object
      required:
        - accepted_events
      properties:
        accepted_events:
          type: integer
          minimum: 0
    UsageErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    UsageGroupBy:
      type: string
      enum:
        - account_id
        - project_id
        - api_key_id
        - user_id
        - user_name
        - model
        - metric_name
        - signal_type
    UsageQueryFilters:
      type: object
      properties:
        account_id:
          type:
            - string
            - 'null'
        api_key_id:
          type:
            - string
            - 'null'
        metric_name:
          type:
            - string
            - 'null'
        model:
          type:
            - string
            - 'null'
        project_id:
          type:
            - string
            - 'null'
        signal_type:
          type:
            - string
            - 'null'
        user_id:
          type:
            - string
            - 'null'
        user_name:
          type:
            - string
            - 'null'
    UsageQueryRequest:
      type: object
      required:
        - scope
        - scope_id
        - start_time
        - end_time
      properties:
        bucket:
          type: string
        end_time:
          type: string
          format: date-time
        filters:
          $ref: '#/components/schemas/UsageQueryFilters'
        group_by:
          type: array
          items:
            $ref: '#/components/schemas/UsageGroupBy'
        limit:
          type: integer
          format: int32
          minimum: 0
        scope:
          $ref: '#/components/schemas/UsageScope'
        scope_id:
          type: string
        start_time:
          type: string
          format: date-time
    UsageQueryResponse:
      type: object
      required:
        - points
      properties:
        points:
          type: array
          items:
            $ref: '#/components/schemas/UsageSeriesPoint'
    UsageScope:
      type: string
      enum:
        - user
        - api_key
        - project
        - account
    UsageSeriesPoint:
      type: object
      required:
        - bucket_start
        - requests
        - usage_value
        - total_cost
        - prompt_tokens
        - completion_tokens
        - total_tokens
        - latency_samples
      properties:
        account_id:
          type:
            - string
            - 'null'
        api_key_id:
          type:
            - string
            - 'null'
        bucket_start:
          type: string
          format: date-time
        completion_tokens:
          type: integer
          format: int64
        latency_samples:
          type: integer
          format: int64
          description: >-
            How many events in this bucket actually carried a latency measurement. A percentile
            over a handful of samples is noise and p99 needs ~100 samples before it means
            anything, so this count is returned alongside the percentiles. 0 means no event in
            this bucket reported latency at all — a legitimate per-series outcome, not an error:
            aggregate metric signals (OTLP histogram / exponential-histogram / summary data
            points) carry a bucketed distribution rather than one observation, so the backend
            deliberately records no latency for them rather than synthesising a mean.
        latency_p50_ms:
          type:
            - number
            - 'null'
          format: double
          description: >-
            Median request latency in milliseconds. Null exactly when latency_samples is 0 —
            never collapsed to 0, because "no latency was reported" and "every request took 0 ms"
            are different facts.
        latency_p95_ms:
          type:
            - number
            - 'null'
          format: double
          description: 95th-percentile request latency in milliseconds. Null when latency_samples is 0.
        latency_p99_ms:
          type:
            - number
            - 'null'
          format: double
          description: >-
            99th-percentile request latency in milliseconds. Null when latency_samples is 0, and
            meaningful only once latency_samples is large (~100+); below that it degenerates
            toward the bucket maximum.
        metric_name:
          type:
            - string
            - 'null'
        model:
          type:
            - string
            - 'null'
        project_id:
          type:
            - string
            - 'null'
        prompt_tokens:
          type: integer
          format: int64
        requests:
          type: integer
          format: int64
        signal_type:
          type:
            - string
            - 'null'
        total_cost:
          type: number
          format: double
        total_tokens:
          type: integer
          format: int64
        usage_value:
          type: number
          format: double
        user_id:
          type:
            - string
            - 'null'
        user_name:
          type:
            - string
            - 'null'
tags:
  - name: ingest
    description: OTEL ingest endpoints
  - name: usage
    description: Timeseries usage query endpoint
