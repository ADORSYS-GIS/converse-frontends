packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
  unrs-resolver: false
  # Its postinstall fetches the pinned cratestack-cli binary from GitHub Releases.
  # Without this, the binary never lands and the root postinstall's `codegen:all`
  # fails on @lightbridge/authz-rpc. See packages/authz-rpc/README.md.
  "@cratestack/cli": true
  # Pulled in by @serwist/turbopack, which uses SWC to compile apps/console's service worker.
  # Its postinstall only resolves the prebuilt native binding for this platform.
  '@swc/core': true
  # Its postinstall only prints a donation-request banner (wrapped in try/catch, so it can never
  # fail the install) -- no functional side effect, so there is nothing to gain by running it.
  core-js: false

minimumReleaseAgeExclude:
  - '@cratestack/adapter-rtk@0.8.13'
  - '@cratestack/adapter-tanstack-query@0.8.13'
  - '@cratestack/api@0.8.13'
  - '@cratestack/cbor@0.8.13'
  - '@cratestack/cli@0.8.13'
  - '@cratestack/link-batch@0.8.13'
  - '@cratestack/link-logger@0.8.13'
  - '@cratestack/refine@0.8.13'
  - '@cratestack/runtime-axios@0.8.13'
  - '@cratestack/runtime-fetch@0.8.13'
  - '@cratestack/ts-types@0.8.13'
  - '@cratestack/validator-yup@0.8.13'
  - '@cratestack/validator-zod@0.8.13'
  - '@tanstack/query-core@5.102.3'
  - '@tanstack/query-persist-client-core@5.102.3'
  - '@tanstack/react-query-persist-client@5.102.3'
  - '@tanstack/react-query@5.102.3'
  - nuqs@2.10.1
  - '@cratestack/cbor-node-darwin-arm64@0.8.13'
  - '@cratestack/cbor-node-darwin-x64@0.8.13'
  - '@cratestack/cbor-node-linux-arm64-gnu@0.8.13'
  - '@cratestack/cbor-node-linux-x64-gnu@0.8.13'
  - '@cratestack/cbor-node-win32-x64-msvc@0.8.13'
  - '@cratestack/cbor-node@0.8.13'
  - '@cratestack/cbor-web@0.8.13'

overrides:
  axios: "^1.18.0" # CVE fix floor raised: GHSA-gcfj-64vw-6mp9 (HIGH) needs >=1.18.0
  "@xmldom/xmldom": "^0.9.10"
  minimatch: "^10.2.3"
  node-forge: "^1.4.0"
  picomatch: "^4.0.4"
  tar: "^7.5.11"
  undici: "^7.24.0"
  "@expo/metro-runtime": "^57.0.0"
  "@expo/dom-webview": "^57.0.1"
  "@react-native/jest-preset": "0.86.2"
  "react-native-worklets": "0.10.1"
  "react-native-reanimated": "4.5.1"
  "react-native-safe-area-context": "~5.7.0"
  "react-native-screens": "~4.26.0"
  "react-native-gesture-handler": "~2.32.0"
  "react-dom": "19.2.3"
  react: 19.2.3
  react-native: 0.86.2
  # Security: transitive-dependency CVE fixes (Trivy HIGH/CRITICAL)
  shell-quote: "^1.8.4" # CVE-2026-9277 (CRITICAL): command injection
  form-data: "^4.0.6" # CVE-2026-12143 (HIGH): field override via CRLF injection
  "ws@7": "^7.5.11" # CVE-2026-48779 (HIGH): DoS via memory exhaustion
  "ws@8": "^8.21.0" # CVE-2026-48779 (HIGH): DoS via memory exhaustion
  postcss: "^8.5.18" # CVE-2026-45623 / GHSA-r28c-9q8g-f849 (HIGH): path traversal via sourceMappingURL auto-loading
  brace-expansion: "^5.0.8" # CVE-2026-13149 / CVE-2026-14257 (HIGH): DoS via crafted brace patterns
  "js-yaml@3": "^3.15.1" # CVE-2026-59869 (HIGH): DoS via crafted YAML; floor raised again for CVE-2026-59870 (HIGH): quadratic CPU consumption in !!omap resolution, fixed 3.15.1
  "js-yaml@4": "^4.3.1" # CVE-2026-59869 (HIGH): same CVE also affects the 4.x line below 4.3.0; floor raised again for CVE-2026-59870 (HIGH): quadratic CPU consumption in !!omap resolution, fixed 4.3.1
  "nanoid@3": "^3.3.18" # CVE-2026-67213 (HIGH): DoS via infinite loop in random ID generation, fixed 3.3.18; also covers CVE-2026-67214 (HIGH): infinite loop in custom alphabet handling, fixed 3.3.16
